[package]
name = "martin-tilegen"
version = "0.1.0"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>", "MapLibre contributors"]
description = "Bulk vector tile generation engine: renders features once per zoom, external-sorts the pieces, and assembles MLT/MVT tilesets"
keywords = ["maps", "tiles", "mvt", "mlt", "tileserver"]
categories = ["science::geo"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true

[[bench]]
name = "sort"
harness = false

[dependencies]
integer-encoding.workspace = true
martin-tile-utils.workspace = true
pmtiles.workspace = true
rayon.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
rstest.workspace = true

[lints]
workspace = true
