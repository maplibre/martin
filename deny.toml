# Dependency policy for this project.
# cargo-deny is used here for *policy enforcement*, not vulnerability scanning.
# Vulnerability advisories are handled separately via cargo-audit.

[licenses]
# Keep this aligned with GitHub dependency-review
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0", # basically MIT
    "MPL-2.0", # copyleft, but not infectious
    "CDLA-Permissive-2.0", # data licence for webkpi roots
]

confidence-threshold = 0.9

exceptions = [
    # Build-time dependencies can have more permissive copyleft licenses
    # since they don't end up in the final binary
    # used by maplibre_native build script
    { crate = "downloader", allow = ["LGPL-3.0-or-later"] },
    # cql2 -> jsonschema -> referencing -> fluent-uri; MIT without the attribution clause
    { crate = "borrow-or-share", allow = ["MIT-0"] },
    # cql2 -> stacker -> psm, build script only; Apache-2.0 with the LLVM linking exception
    { crate = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # cog-tiles-py -> pyo3 -> pyo3-build-config, build script only; Apache-2.0 with the LLVM linking exception
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # cog-tiles-py -> pyo3-stub-gen -> rustpython-parser, only used to write the Python stub
    { crate = "unicode_names2", allow = ["Unicode-DFS-2016"] },
    # martin `fips` feature -> rustls -> aws-lc-rs; the FIPS-validated AWS-LC module keeps the OpenSSL licence
    { crate = "aws-lc-fips-sys", allow = ["OpenSSL"] },
]

[licenses.private]
ignore = true

# Some crates don't have (easily) machine readable licensing information,
# adding a clarification entry for it allows you to manually specify the
# licensing information
#[[licenses.clarify]]
# The package spec the clarification applies to
#crate = "ring"
# The SPDX expression for the license requirements of the crate
#expression = "MIT AND ISC AND OpenSSL"
# One or more files in the crate's source used as the "source of truth" for
# the license expression. If the contents match, the clarification will be used
# when running the license check, otherwise the clarification will be ignored
# and the crate will be checked normally, which may produce warnings or errors
# depending on the rest of your configuration
#license-files = [
# Each entry is a crate relative path, and the (opaque) hash of its contents
#{ path = "LICENSE", hash = 0xbd0eed23 }
#]

# quantizr only points at its MIT licence through `license-file`
[[licenses.clarify]]
crate = "quantizr"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x28032a6c }]

[bans]
# Would be nice for compile time, but currently we don't have the capacity for this
multiple-versions = "allow"

# Wildcard versions are almost always accidental
wildcards = "deny"

# Explicitly allowed exceptions go here (keep empty unless justified)
skip = []
skip-tree = []

# List of crates to deny
# changes here need to be synced `just update`
deny = [
    # The last-known-good versions are pinned in `just update`; ban everything newer
    # until a release is verified to build on all targets (musl + Windows).
    { crate = "freetype-sys:>0.20.1", reason = "newer releases bundle a libpng that fails to compile (missing zlib.h) on musl and Windows" },
    { crate = "freetype-rs:>0.35.0", reason = "newer releases depend on freetype-sys >0.20.1 which fails to compile on musl and Windows" },
    { crate = "sdf_glyph_renderer:>1.0.2", reason = "newer releases depend on freetype-rs >0.35.0 which fails to compile on musl and Windows" },
    { crate = "static-files:>0.2.5", reason = "0.3.x changes the generated asset format, but actix-web-static-files 4.1.1 still consumes static-files 0.2; mixing them breaks the webui asset embedding" },
    { crate = "prettyplease:>0.2.37", reason = "0.3.x is built on syn 3, and bindgen 0.73 can resolve it next to syn 2, which then fails to compile (https://github.com/rust-lang/rust-bindgen/issues/3448)" },
]

[sources]
# Supply-chain hardening: only crates.io, no git deps
unknown-registry = "deny"
unknown-git = "deny"

# If git deps are ever needed, they must be explicitly allowed here
allow-git = [
  "https://github.com/CommanderStorm/wkb",
]

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
