<svg id="cog-zxy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" role="img" aria-label="A COG holds one image per zoom, each cut into internal tiles; z picks the image, x and y pick its tile, and the tile tables point at the bytes to read"><title>A COG holds one image per zoom, each cut into internal tiles; z picks the image, x and y pick its tile, and the tile tables point at the bytes to read</title><style>#cog-zxy{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#cog-zxy .fg{fill:var(--md-default-fg-color,#000000de)}#cog-zxy .muted{fill:var(--md-default-fg-color--light,#0000008a)}#cog-zxy .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#cog-zxy .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#cog-zxy .head{fill:var(--md-default-fg-color--light,#0000008a)}#cog-zxy text{dominant-baseline:central}#cog-zxy .t{font-weight:600}#cog-zxy .s{font-size:11px}#cog-zxy .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#cog-zxy .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#cog-zxy .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-zxy .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-zxy .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#cog-zxy .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#cog-zxy .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#cog-zxy .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#cog-zxy .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#cog-zxy .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#cog-zxy .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="box" x="40" y="202" width="48" height="48" rx="0"/><text class="fg s t" x="64" y="190" text-anchor="middle">zoom 12</text><text class="muted s" x="64" y="264" text-anchor="middle">overview</text><rect class="hi" x="130" y="154" width="48" height="48" rx="0"/><rect class="sel" x="178" y="154" width="48" height="48" rx="0"/><rect class="hi" x="130" y="202" width="48" height="48" rx="0"/><rect class="hi" x="178" y="202" width="48" height="48" rx="0"/><text class="fg s t" x="178" y="142" text-anchor="middle">zoom 13</text><text class="muted s" x="178" y="264" text-anchor="middle">overview</text><rect class="box" x="270" y="74" width="44" height="44" rx="0"/><rect class="box" x="314" y="74" width="44" height="44" rx="0"/><rect class="box" x="358" y="74" width="44" height="44" rx="0"/><rect class="box" x="402" y="74" width="44" height="44" rx="0"/><rect class="box" x="270" y="118" width="44" height="44" rx="0"/><rect class="box" x="314" y="118" width="44" height="44" rx="0"/><rect class="box" x="358" y="118" width="44" height="44" rx="0"/><rect class="box" x="402" y="118" width="44" height="44" rx="0"/><rect class="box" x="270" y="162" width="44" height="44" rx="0"/><rect class="box" x="314" y="162" width="44" height="44" rx="0"/><rect class="box" x="358" y="162" width="44" height="44" rx="0"/><rect class="box" x="402" y="162" width="44" height="44" rx="0"/><rect class="box" x="270" y="206" width="44" height="44" rx="0"/><rect class="box" x="314" y="206" width="44" height="44" rx="0"/><rect class="box" x="358" y="206" width="44" height="44" rx="0"/><rect class="box" x="402" y="206" width="44" height="44" rx="0"/><text class="fg s t" x="358" y="62" text-anchor="middle">zoom 14</text><text class="muted s" x="358" y="264" text-anchor="middle">full resolution</text><text class="muted s" x="243" y="290" text-anchor="middle">one TIFF image (IFD) per zoom</text><rect class="hi" x="130" y="22" width="220" height="30" rx="15"/><text class="fg mono" x="240" y="37" text-anchor="middle">GET /dem/13/{x}/{y}</text><path class="arrow" d="M178 52 L178 140"/><path class="head" d="M178 140 L174.0 132.0 L182.0 132.0 Z"/><text class="fg t s" x="500" y="40" text-anchor="start">1. z -> image</text><text class="muted s" x="500" y="57" text-anchor="start">zoom 13</text><text class="fg t s" x="500" y="84" text-anchor="start">2. x, y -> tile</text><text class="muted s" x="500" y="101" text-anchor="start">column 1, row 0</text><text class="fg t s" x="500" y="128" text-anchor="start">3. tile -> bytes</text><text class="muted s" x="500" y="145" text-anchor="start">TileOffsets[i], TileByteCounts[i]</text><text class="fg t s" x="500" y="180" text-anchor="start">.tif file</text><rect class="box" x="500" y="196" width="110" height="34" rx="0"/><text class="muted s" x="555" y="213" text-anchor="middle">header, IFDs</text><rect class="box" x="610" y="196" width="24" height="34" rx="0"/><rect class="box" x="634" y="196" width="24" height="34" rx="0"/><rect class="box" x="658" y="196" width="24" height="34" rx="0"/><rect class="box" x="682" y="196" width="24" height="34" rx="0"/><rect class="hi" x="706" y="196" width="24" height="34" rx="0"/><rect class="hi" x="730" y="196" width="24" height="34" rx="0"/><rect class="sel" x="754" y="196" width="24" height="34" rx="0"/><rect class="hi" x="778" y="196" width="24" height="34" rx="0"/><rect class="box" x="802" y="196" width="24" height="34" rx="0"/><rect class="box" x="826" y="196" width="24" height="34" rx="0"/><rect class="box" x="850" y="196" width="24" height="34" rx="0"/><rect class="box" x="874" y="196" width="24" height="34" rx="0"/><rect class="box" x="898" y="196" width="24" height="34" rx="0"/><path class="accarrow" d="M766 260 L766 234"/><path class="acchead" d="M766 234 L770.0 242.0 L762.0 242.0 Z"/><text class="muted s" x="766" y="272" text-anchor="