<svg id="cog-align" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" role="img" aria-label="Each image of a COG must line up with the tiles of its zoom level; an overview that does not is skipped"><title>Each image of a COG must line up with the tiles of its zoom level; an overview that does not is skipped</title><style>#cog-align{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#cog-align .fg{fill:var(--md-default-fg-color,#000000de)}#cog-align .muted{fill:var(--md-default-fg-color--light,#0000008a)}#cog-align .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#cog-align .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#cog-align .head{fill:var(--md-default-fg-color--light,#0000008a)}#cog-align text{dominant-baseline:central}#cog-align .t{font-weight:600}#cog-align .s{font-size:11px}#cog-align .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#cog-align .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#cog-align .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-align .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-align .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#cog-align .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#cog-align .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#cog-align .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#cog-align .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#cog-align .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#cog-align .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg s t" x="160" y="40" text-anchor="middle">zoom 14, full resolution</text><rect class="ghost" x="40" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="80" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="120" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="160" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="200" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="240" y="70" width="40" height="40" rx="0"/><rect class="ghost" x="40" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="80" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="120" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="160" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="200" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="240" y="110" width="40" height="40" rx="0"/><rect class="ghost" x="40" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="80" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="120" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="160" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="200" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="240" y="150" width="40" height="40" rx="0"/><rect class="ghost" x="40" y="190" width="40" height="40" rx="0"/><rect class="ghost" x="80" y="190" width="40" height="40" rx="0"/><rect class="ghost" x="120" y="190" width="40" height="40" rx="0"/><rect class="ghost" x="160" y="190" width="40" height="40" rx="0"/><rect class="ghost" x="200" y="190" width="40" height="40" rx="0"/><rect class="ghost" x="240" y="190" width="40" height="40" rx="0"/><rect class="hi" x="80" y="110" width="40" height="40" rx="0"/><rect class="hi" x="120" y="110" width="40" height="40" rx="0"/><rect class="hi" x="160" y="110" width="40" height="40" rx="0"/><rect class="hi" x="200" y="110" width="40" height="40" rx="0"/><rect class="hi" x="80" y="150" width="40" height="40" rx="0"/><rect class="hi" x="120" y="150" width="40" height="40" rx="0"/><rect class="hi" x="160" y="150" width="40" height="40" rx="0"/><rect class="hi" x="200" y="150" width="40" height="40" rx="0"/><text class="muted s" x="160" y="248" text-anchor="middle">internal tiles match zoom 14 tiles</text><text class="fg s t" x="160" y="270" text-anchor="middle">served</text><text class="fg s t" x="460" y="40" text-anchor="middle">zoom 13, overview</text><rect class="ghost" x="340" y="70" width="80" height="80" rx="0"/><rect class="ghost" x="420" y="70" width="80" height="80" rx="0"/><rect class="ghost" x="500" y="70" width="80" height="80" rx="0"/><rect class="ghost" x="340" y="150" width="80" height="80" rx="0"/><rect class="ghost" x="420" y="150" width="80" height="80" rx="0"/><rect class="ghost" x="500" y="150" width="80" height="80" rx="0"/><rect class="apron" x="380" y="110" width="80" height="80" rx="0"/><rect class="apron" x="460" y="110" width="80" height="80" rx="0"/><text class="muted s" x="460" y="248" text-anchor="middle">internal tiles do not match zoom 13 tiles</text><text class="fg s t" x="460" y="270" text-anchor="middle">skipped, with a warning</text><rect class="accdot" x="76" y="106" width="8" height="8" rx="4"/><rect class="accdot" x="376" y="106" width="8" height="8" rx="4"/><text class="muted s" x="388" y="96" text-anchor="start">starts part-way into a tile</text><text class="fg t s" x="640" y="70" text-anchor="start">1. resolution</text><text class="muted s" x="640" y="87" text-anchor="start">of a WebMercatorQuad zoom level</text><text class="fg t s" x="640" y="114" text-anchor="start">2. internal tiles</text><text class="muted s" x="640" y="131" text-anchor="start">line up with that zoom's tiles</text><text class="fg t s" x="640" y="158" text-anchor="start">3. no image can be served</text><text class="muted s" x="640" y="175" text-anchor="start">file rejected</text><text class="fg t s" x="640" y="214" text-anchor="start">GDAL</text><text class="fg mono" x="640" y="232" text-anchor="start">-co TILING_SCHEME=</text><text class="fg mono" x="640" y="248" text-anchor="start">    GoogleMapsCompatible</text></svg>
