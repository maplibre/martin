dth="120" height="90" rx="6"/><text class="fg t" x="760.0" y="144.0" text-anchor="middle">merge</text><text class="muted s" x="760.0" y="160.0" text-anchor="middle">loser tree</text><text class="muted s" x="760.0" y="176.0" text-anchor="middle">streams in key order</text><path class="arrow" d="M820 160 L850 160"/><path class="head" d="M850.0 160.0 L842.0 156.0 L842.0 164.0 Z"/><rect class="b-sort" x="850" y="115" width="90" height="90" rx="6"/><text class="fg t" x="895.0" y="152.0" text-anchor="middle">group</text><text class="muted s" x="895.0" y="168.0" text-anchor="middle">by tile</text><text class="muted s" x="480" y="290" text-anchor="middle">the excess runs are merged first, the rest wait for the final merge, which is never written to disk</text></svg>
