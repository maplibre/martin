<svg id="gen-merge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img" aria-label="Merging more runs than fit at once: only the adjacent runs with the fewest bytes are merged first, then all remaining runs are merged as they stream into phase 2"><title>Merging more runs than fit at once: only the adjacent runs with the fewest bytes are merged first, then all remaining runs are merged as they stream into phase 2</title><style>#gen-merge{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-merge .fg{fill:var(--md-default-fg-color,#000000de)}#gen-merge .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-merge .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-merge .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-merge .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-merge text{dominant-baseline:central}#gen-merge .t{font-weight:600}#gen-merge .s{font-size:11px}#gen-merge .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-merge .motion{display:none}}#gen-merge .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-merge .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-merge .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-merge .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-merge .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-merge .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-merge .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-merge .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-merge .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-merge .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-merge .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-merge .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-merge .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-merge .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-merge .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-merge .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-merge .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-merge .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg t s" x="40" y="30" text-anchor="start">sorted runs</text><text class="muted s" x="40" y="44" text-anchor="start">7 runs, 4 merged at once in this example</text><text class="muted s" x="40" y="70" text-anchor="start">run 0</text><rect class="b-read" x="90" y="60" width="90" height="20" rx="3"/><text class="muted s" x="40" y="100" text-anchor="start">run 1</text><rect class="b-read" x="90" y="90" width="108" height="20" rx="3"/><text class="muted s" x="40" y="130" text-anchor="start">run 2</text><rect class="b-sort" x="90" y="120" width="36" height="20" rx="3"/><text class="muted s" x="40" y="160" text-anchor="start">run 3</text><rect class="b-sort" x="90" y="150" width="18" height="20" rx="3"/><text class="muted s" x="40" y="190" text-anchor="start">run 4</text><rect class="b-sort" x="90" y="180" width="36" height="20" rx="3"/><text class="muted s" x="40" y="220" text-anchor="start">run 5</text><rect class="b-sort" x="90" y="210" width="18" height="20" rx="3"/><text class="muted s" x="40" y="250" text-anchor="start">run 6</text><rect class="b-read" x="90" y="240" width="108" height="20" rx="3"/><path class="line" d="M210 120 H218 V230 H210"/><path class="arrow" d="M218 175.0 L262 175.0"/><path class="head" d="M26