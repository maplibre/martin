name: Setup Rust
description: Free runner disk space, install a Rust toolchain, and install the build tooling.
inputs:
  toolchain:
    description: >-
      Rust toolchain to install and set as the default, e.g. "stable" or "nightly".
      "none" skips the toolchain (and the disk cleanup sized for Rust builds) for
      jobs that only need the prebuilt tools.
    default: "stable"
  components:
    description: Space-separated rustup components to add, e.g. "clippy rustfmt".
    default: ""
  tools:
    description: Comma-separated tools to install via taiki-e/install-action, e.g. "just,cargo-binstall". Empty to skip.
    default: "just"
  rendering:
    description: Install the system dependencies needed to build maplibre-native. No-op on non-Linux runners.
    default: "false"
  cache:
    description: >-
      Restore the Rust build cache, and save it when running on main.
      Opt-in because the repo shares a 10GB quota across all caches.
    default: "false"
  coverage:
    description: >-
      Instrument the job with cargo-llvm-cov, so its tests record coverage.
      Collect it with the `upload-coverage` action.
    default: "false"
runs:
  using: composite
  steps:
    # Frees ~25GB. martin compiles the bundled DuckDB and maplibre-native C++ trees, which
    # otherwise exhaust the default runner disk. No-op on non-Linux runners.
    - if: runner.os == 'Linux' && inputs.toolchain != 'none'
      uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
      with:
        tool-cache: false
        mandb:   true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - if: inputs.toolchain != 'none'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"
    - if: inputs.components != ''
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: rustup component add $COMPONENTS
    - if: inputs.cache == 'true' && github.event_name != 'release' && github.event_name != 'workflow_dispatch'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] dev-only build cache; poisoning risk accepted
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        key: ${{ inputs.coverage == 'true' && 'coverage' || '' }}
    - if: inputs.tools != ''
      uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
      with: { tool: '${{ inputs.tools }}' }
    - if: inputs.rendering == 'true' && runner.os == 'Linux'
      shell: bash
      run: just install-dependencies
    - if: runner.os == 'Linux' && inputs.toolchain != 'none'
      shell: bash
      run: just env-info
    - if: inputs.coverage == 'true'
      uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
      with: { tool: 'cargo-llvm-cov' }
    - if: inputs.coverage == 'true'
      shell: bash
      run: just coverage-env "$GITHUB_ENV"
