name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint-unit-test-js:
    name: Lint and Unit test the frontend
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { toolchain: none }
      - run: npm clean-install --no-fund
        working-directory: crates/martin-ui
      - run: just ui::biome
      - run: just ui::test
      - run: just ui::type-check
      - run: just ui::build

  e2e-js:
    name: End-to-end test the frontend
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { toolchain: none }
      - run: npm clean-install --no-fund
        working-directory: crates/martin-ui
      - run: npx playwright install --with-deps chromium
        working-directory: crates/martin-ui
      - run: docker pull ghcr.io/maplibre/martin:nightly
      - run: just ui::e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: crates/martin-ui/playwright-report
          retention-days: 7
