name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'release' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: Decide which suites this change can affect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      # The Windows and macOS builds, and the publish dry-run, re-prove on a
      # second platform what the Linux lane already covers, so they are deferred
      # for pull requests sitting below the top of their stack. A pull request
      # that is not stacked counts as its own top, and pushes and releases run
      # everything.
      run-heavy: ${{ github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
    steps:
      - name: Classify the changed files
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > files.txt
          cat files.txt

          # A file that matches nothing below claims the Rust suite, so a new
          # directory can never silently lose its coverage.
          rust=false
          ui=false
          docs=false
          while IFS= read -r f; do
            case "$f" in
              # Shared tooling: every suite reads these.
              .github/*|justfile)
                rust=true; ui=true; docs=true ;;
              # martin/build.rs compiles the frontend into the server binary,
              # so a broken frontend breaks every Rust job too.
              martin/martin-ui/*)
                ui=true; rust=true ;;
              # validate-schemas checks the generated example in here against
              # schemas/config.json.
              docs/content/files/*)
                docs=true; rust=true ;;
              docs/*|zensical.toml)
                docs=true ;;
              # Nothing builds or tests these.
              graphics/*|logo.png|CITATION.cff|LICENSE-APACHE|LICENSE-MIT)
                ;;
              # Crate READMEs are pulled in with include_str! and are doc-tested.
              *.md)
                docs=true; rust=true ;;
              *)
                rust=true ;;
            esac
          done < files.txt

          if [[ ! -s files.txt ]]; then
            rust=true; ui=true; docs=true
          fi

          {
            echo "rust=$rust"
            echo "ui=$ui"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"
          echo "rust=$rust ui=$ui docs=$docs"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      run-heavy: ${{ needs.changes.outputs.run-heavy == 'true' }}
    secrets: inherit
    # The union of what rust.yml's own jobs ask for; each of them narrows this
    # down to what it actually needs.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
      code-quality: write
      pull-requests: read

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml
    permissions:
      contents: read

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write

  # This final step is needed to mark the whole workflow as successful
  # Don't change its name - it is used by the merge protection rules
  done:
    name: CI Finished
    needs:
      - changes
      - rust
      - ui
      - docs
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}" # zizmor: ignore[template-injection]
      # A skip is a pass here: `changes` drops the suites a pull request cannot
      # affect, and run-heavy defers duplicate platform coverage to the top of a
      # stack. Failures inside a called workflow still surface, because a
      # reusable-workflow job fails when any job inside it fails.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: CI Result
        run: exit 1

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ done ]
    if: |
      always()
      && needs.done.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'maplibre'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-rust
        with: { rendering: true }
      - name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
