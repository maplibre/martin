name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'release' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: Decide which suites this change can affect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      schemas: ${{ github.event_name != 'pull_request' || steps.filter.outputs.schemas == 'true' }}
      run-heavy: ${{ github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/**'
              - 'justfile'
            rust:
              - *shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'deny.toml'
              - 'release-plz.toml'
              - 'docker-compose.yml'
              - 'debian/**'
              - 'e2e-tests/**'
              - 'tests/**'
              - 'mbtiles/**'
              # Covers every crate, their READMEs (doc-tested via include_str!)
              # and martin-ui, which build.rs compiles into the server binary.
              - 'martin*/**'
            ui:
              - *shared
              - 'biome.json'
              - 'martin/martin-ui/**'
            docs:
              - *shared
              - '**/*.md'
              - 'docs/**'
              - 'zensical.toml'
            schemas:
              - *shared
              - 'schemas/**'
              - 'docs/content/files/generated_config.md'
              - 'e2e-tests/tests/snapshots/save_config__*'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      run-heavy: ${{ needs.changes.outputs.run-heavy == 'true' }}
    secrets: inherit
    # The union of what rust.yml's own jobs ask for; each of them narrows this
    # down to what it actually needs.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
      code-quality: write
      pull-requests: read

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml
    permissions:
      contents: read

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write

  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    uses: ./.github/workflows/schemas.yml
    permissions:
      contents: read

  # Packaging and publishing. Gated on the suites rather than on `done`, which
  # in turn waits for this job, so a broken release process still blocks merge.
  release:
    needs:
      - changes
      - rust
      - ui
      - docs
      - schemas
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/release.yml
    with:
      run-heavy: ${{ needs.changes.outputs.run-heavy == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  # This final step is needed to mark the whole workflow as successful
  # Don't change its name - it is used by the merge protection rules
  done:
    name: CI Finished
    needs:
      - changes
      - rust
      - ui
      - docs
      - schemas
      - release
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}" # zizmor: ignore[template-injection]
      # A skip is a pass here: `changes` drops the suites a pull request cannot
      # affect, and run-heavy defers duplicate platform coverage to the top of a
      # stack. Failures inside a called workflow still surface, because a
      # reusable-workflow job fails when any job inside it fails.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: CI Result
        run: exit 1
