name: Schemas CI

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate-schemas:
    name: Validate generated config + OpenAPI schemas
    permissions:
      contents: read
    # The `schemas/` files this validates are kept up to date by the
    # `gen-schemas` job in `.github/workflows/autofix.yml`, which regenerates
    # and commits them on every PR push - so this job only needs to read the
    # committed files, no Rust toolchain required.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { toolchain: none }
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: false } # uv is a one-off tool runner here; no Python deps to cache
      - run: just test-schemas
