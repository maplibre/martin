name: Hotpath relay

on:
  # zizmor: ignore[dangerous-triggers] intentional two-workflow split: fork PRs
  # get no OIDC token, so this one uploads the report artifact without checking
  # out PR code.
  workflow_run:
    workflows: ["Hotpath benchmark"]
    types: [completed]

permissions: {}

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mbtiles-miss
          - pmtiles-miss
          - postgres-function-miss
          - postgres-function-mlt-miss
          - postgres-table-miss
          - composite-miss
          - cache-hit
          - toolkit-slice
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    concurrency:
      group: hotpath-relay-${{ matrix.scenario }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@d40b0e465fa852b0c1f4e33989140d11d7b2742c # v1.0.0
        with:
          benchmark: ${{ matrix.scenario }}
          artifact_name: hotpath-report
          report_file: ${{ matrix.scenario }}.json
