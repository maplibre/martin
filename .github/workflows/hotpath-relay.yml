name: Hotpath relay

on:
  # zizmor: ignore[dangerous-triggers] intentional two-workflow split: fork PRs
  # get no OIDC token, so this one uploads the report artifact without checking
  # out PR code.
  workflow_run:
    workflows: ["Hotpath benchmark"]
    types: [completed]

permissions: {}

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mbtiles-miss
          - pmtiles-miss
          - postgres-function-miss
          - postgres-function-mlt-miss
          - postgres-table-miss
          - composite-miss
          - cache-hit
          - toolkit-slice
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@a9b63a7472d299ed43f0f25dd30b6c969f636814 # v0.29.1
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: ${{ matrix.scenario }}
      artifact_name: hotpath-report
      report_file: ${{ matrix.scenario }}.json
