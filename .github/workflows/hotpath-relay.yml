name: Hotpath relay

on:
  # zizmor: ignore[dangerous-triggers] intentional two-workflow split: fork PRs
  # get no OIDC token, so this one uploads the report artifact without checking
  # out PR code.
  workflow_run:
    workflows: ["Hotpath benchmark"]
    types: [completed]

permissions: {}

jobs:
  relay:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@e9010631dbc961585f5f5c096c17c8e944ce58c5 # main
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: http
      artifact_name: hotpath-report
      report_file: report.json
