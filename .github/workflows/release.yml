name: Release

on:
  workflow_call:
    inputs:
      run-heavy:
        description: >-
          Packaging consumes every build-binary artifact, including the ones
          that only run at the top of a stack.
        type: boolean
        default: true
    secrets:
      RELEASE_PLZ_APP_ID:
        description: ID of the GitHub App release-plz publishes releases and release PRs as
        required: false
      RELEASE_PLZ_APP_PRIVATE_KEY:
        description: Private key of the GitHub App release-plz publishes releases and release PRs as
        required: false
  workflow_dispatch:
    inputs:
      run-heavy:
        description: Package the release artifacts
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      # for writing attestations
      id-token: write
      attestations: write
      # for writing release artifacts
      contents: write
    # Packaging downloads every build-binary artifact rust.yml produced, so it
    # can only run when the heavy builds did. ci.yml only reaches this workflow
    # once the rust, ui and docs suites have passed.
    if: inputs.run-heavy
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # cargo and cargo-cyclonedx resolve the mbtiles dependency tree for its per-target SBOMs
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,cargo-cyclonedx' }
      - name: Download syft
        id: syft
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - name: Put syft on the PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          output-file: martin.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'build-*', path: 'target' }

      - name: Package
        run: |
          set -x

          for dir in target/build-*; do
            target="${dir#target/build-}"
            mv "$dir" "target/$target"
            just package-assets "$target"
          done
      - name: Save the packaged binaries for release-plz
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'release-files', path: 'target/files/*', retention-days: 1 }

      # release-plz attaches the binaries before it publishes, so a release event
      # only has to upload them when someone published a draft by hand.
      - name: Look up the release
        if: github.event_name == 'release'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG_NAME" --json assets --jq '.assets | length')
          if [[ "$assets" -gt 0 ]]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate SLSA build provenance attestation
        if: github.event_name == 'release' && steps.release.outputs.has_assets == 'false'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'target/files/*' }
      - name: Publish with artifacts
        if: ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'martin-v') || startsWith(github.event.release.tag_name, 'mbtiles-v')) && steps.release.outputs.has_assets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # an unmatched glob stays literal, so the upload fails instead of publishing without binaries
          case "$RELEASE_TAG_NAME" in
            martin-v*) files=(target/files/martin-* target/files/debian-*.deb) ;;
            mbtiles-v*) files=(target/files/mbtiles-*) ;;
          esac
          cp "$ATTESTATION_BUNDLE" target/provenance.json
          gh release upload "$RELEASE_TAG_NAME" "${files[@]}" target/provenance.json --clobber
          if [[ "$RELEASE_TAG_NAME" == martin-v* && "$RELEASE_IS_PRERELEASE" != true ]]; then latest=true; else latest=false; fi
          gh release edit "$RELEASE_TAG_NAME" --verify-tag --draft=false --latest="$latest"
      - name: Publish without artifacts
        if: ${{ github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'martin-v') && !startsWith(github.event.release.tag_name, 'mbtiles-v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release edit "$RELEASE_TAG_NAME" --verify-tag --draft=false --latest=false

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ package ]
    if: |
      always()
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'maplibre'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup-rust
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      # martin-ui publishes the built bundle, and its build.rs refuses a package without one.
      - name: Build the web UI bundle
        run: just ui::build
      # A GitHub App token, so that the tags, releases and PRs release-plz creates
      # trigger workflows. Events created with GITHUB_TOKEN start no workflow.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          # tags and releases, and the release PRs
          permission-contents: write
          permission-pull-requests: write
      - name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Download the packaged binaries
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'release-files', path: 'target/files' }
      - name: Generate SLSA build provenance attestation
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'target/files/*' }
      - name: Attach the binaries and publish the drafted releases
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          # The app token, so that publishing fires `release: published` for the docker tags.
          # Events created with GITHUB_TOKEN start no workflow.
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_BUNDLE" target/provenance.json
          for tag in $(jq -r '.[].tag' <<< "$RELEASES"); do
            state=$(gh release view "$tag" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' || true)
            if [[ "$state" != "true "* ]]; then
              echo "$tag has no draft release to publish, skipping"
              continue
            fi
            # an unmatched glob stays literal, so the upload fails instead of publishing without binaries
            case "$tag" in
              martin-v*) gh release upload "$tag" target/files/martin-* target/files/debian-*.deb target/provenance.json --clobber ;;
              mbtiles-v*) gh release upload "$tag" target/files/mbtiles-* target/provenance.json --clobber ;;
            esac
            if [[ "$tag" == martin-v* && "$state" == "true false" ]]; then latest=true; else latest=false; fi
            gh release edit "$tag" --verify-tag --draft=false --latest="$latest"
          done
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with: { enable-cache: false } # uv is a one-off tool runner here; no Python deps to cache
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: Check out main's head for the release PR
        run: git fetch origin main && git reset --hard FETCH_HEAD
      # release-pr commits what this generates along with the bump (`allow_dirty` in release-plz.toml),
      # which autofix.yml otherwise pushes after it.
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: Generate the files that follow martin's next version
        id: generate
        continue-on-error: true
        run: |
          set -euo pipefail
          # release-plz is on the PATH from the release step
          release-plz update --package martin
          mapfile -t bumped < <(git diff --name-only)
          # what the autofix.yml jobs push, in the order they push it
          uvx prek@0.5.5 run --all-files || [ $? -eq 1 ] # 1 is a hook that changed files
          just fmt-toml
          npm --prefix demo/frontend install --package-lock-only --no-fund
          npm --prefix martin-ui install --package-lock-only --no-fund
          just gen-schemas
          uvx prek@0.5.5 run --files schemas/config.json martin/openapi.json martin-ui/src/lib/types.gen.ts || [ $? -eq 1 ]
          # release-pr bumps these itself
          if (( ${#bumped[@]} )); then git checkout -- "${bumped[@]}"; fi
          just update-lockfile
          git status --short
      - if: ${{ steps.generate.outcome == 'failure' }}
        name: Hand release-pr a clean tree
        run: git reset --hard && git clean -fd
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
