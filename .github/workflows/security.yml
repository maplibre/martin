name: Security audit

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: Decide which scans this change can affect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actions: ${{ github.event_name != 'pull_request' || steps.filter.outputs.actions == 'true' }}
      cargo-deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cargo-deps == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
      codeql-languages: ${{ steps.codeql.outputs.languages }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/**'
            cargo-manifests: &cargo-manifests
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'deny.toml'
            npm-manifests: &npm-manifests
              - 'martin/martin-ui/package.json'
              - 'martin/martin-ui/package-lock.json'
              - 'demo/frontend/package.json'
              - 'demo/frontend/package-lock.json'
            actions:
              - *shared
            rust:
              - *shared
              - *cargo-manifests
              - '**/*.rs'
            js:
              - *shared
              - *npm-manifests
              - 'martin/martin-ui/**'
              - 'demo/frontend/**'
            cargo-deps:
              - *shared
              - *cargo-manifests
            deps:
              - *shared
              - *cargo-manifests
              - *npm-manifests
      # CodeQL is one job per language, so the languages a change cannot affect
      # are dropped from the matrix rather than from the job as a whole.
      - name: Collect the CodeQL languages worth analysing
        id: codeql
        env:
          ACTIONS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.actions == 'true' }}
          JS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
          RUST: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
        run: |
          languages=()
          if [[ "$ACTIONS" == 'true' ]]; then languages+=('"actions"'); fi
          if [[ "$JS" == 'true' ]]; then languages+=('"javascript-typescript"'); fi
          if [[ "$RUST" == 'true' ]]; then languages+=('"rust"'); fi
          printf 'languages=[%s]\n' "$(IFS=,; echo "${languages[*]}")" >> "$GITHUB_OUTPUT"

  zizmor:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
  audit:
    needs: changes
    if: needs.changes.outputs.cargo-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071,RUSTSEC-2024-0436,RUSTSEC-2025-0119,RUSTSEC-2025-0134,RUSTSEC-2026-0002,RUSTSEC-2026-0007,RUSTSEC-2026-0049,RUSTSEC-2026-0097,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104,RUSTSEC-2026-0105,RUSTSEC-2025-0141,RUSTSEC-2026-0145,RUSTSEC-2026-0179,RUSTSEC-2026-0180,RUSTSEC-2026-0178,RUSTSEC-2026-0189,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0258
          # RUSTSEC-2023-0071 = Marvin Attack: potential key recovery through timing side channels => not used exploitably
          # RUSTSEC-2024-0436 = paste - no longer maintained
          # RUSTSEC-2025-0119 = number_prefix is unmaintained, but we need no change in this lib
          # RUSTSEC-2025-0134 = rustls-pemfile is unmaintained, but only used in development dependencies
          # RUSTSEC-2025-0141 = bincode unmaintained, is done
          # RUSTSEC-2026-0002 = unsound stack borrow in lru
          # RUSTSEC-2026-0007 = integer overflow in bytes
          # RUSTSEC-2026-0049 = rustls-webpki@0.101.7 CRL matching bug; stuck in aws-smithy-http-client's legacy rustls@0.21 chain, cannot be upgraded without an upstream aws-sdk-s3 release
          # RUSTSEC-2026-0097 = rand unsoundness with custom logger + rand::rng(); pinned by probabilistic-collections 0.7.0 (rand 0.7) and sqlx 0.8 (rand 0.8), neither have updates available
          # RUSTSEC-2026-0098 = rustls-webpki name constraints for URI names; remaining finding is rustls-webpki@0.101.7 in aws-smithy-http-client's legacy rustls@0.21 chain
          # RUSTSEC-2026-0099 = rustls-webpki wildcard name constraints; remaining finding is rustls-webpki@0.101.7 in aws-smithy-http-client's legacy rustls@0.21 chain
          # RUSTSEC-2026-0104 = rustls-webpki CRL parsing panic; only remaining finding is rustls-webpki@0.101.7 in aws-smithy-http-client's legacy rustls@0.21 chain
          # RUSTSEC-2026-0105 = core2 unmaintained
          # RUSTSEC-2026-0145 = astral-tokio-tar header desync, not used exploitably
          # RUSTSEC-2026-0179 = postgres-protocol dos
          # RUSTSEC-2026-0180 = postgres-protocol dos
          # RUSTSEC-2026-0178 = tokio-postgres dos
          # RUSTSEC-2026-0189 = rmcp Streamable HTTP DNS rebinding; only pulled in via hotpath's hotpath-mcp profiling tool, never compiled into the shipped server
          # RUSTSEC-2026-0194 = quick-xml quadratic attribute-check dos; transitive via object_store 0.13 (quick-xml ^0.39), patched only in quick-xml 0.41 which needs a breaking object_store 0.14 bump
          # RUSTSEC-2026-0195 = quick-xml unbounded namespace-declaration dos; same object_store 0.13 pin, patched only in quick-xml 0.41
          # RUSTSEC-2026-0258 = h2 unbounded empty DATA frames dos; remaining leg is h2@0.3.27 pinned by actix-http (still on h2 "0.3" even at 3.13.3), no patched 0.3.x release exists
  dependency-review:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false # incredibly high maintenance cost, also many false positives and not ability to ignore issues like "MIT/APACHE2" being used
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5
          allow-ghsas: GHSA-cq8v-f236-94qc # rand@0.7.3 unsoundness with custom logger; pinned by probabilistic-collections 0.7.0, cannot be upgraded
      # actions/dependency-review-action does not find all licenses -> we use cargo-deny for this in addition to dependency-review-action
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.codeql-languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql-languages) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - name: Initialize CodeQL
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        languages: ${{ matrix.language }}
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        category: "/language:${{matrix.language}}"

  # This final step is needed to mark the whole workflow as successful
  # Don't change its name - it is used by the merge protection rules
  done:
    name: Security Finished
    needs:
      - changes
      - zizmor
      - audit
      - dependency-review
      - codeql
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}" # zizmor: ignore[template-injection]
      # A skip is a pass here: `changes` drops the scans a pull request cannot
      # affect, and `dependency-review` only ever runs on pull requests.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Security Result
        run: exit 1
