name: Security CI

on:
  workflow_call:
    inputs:
      run-actions:
        description: Scan the workflow definitions with zizmor.
        type: boolean
        default: true
      run-cargo-deps:
        description: >-
          Audit the Cargo dependencies against the RustSec advisory database.
        type: boolean
        default: true
      run-dependency-review:
        description: Review the dependency changes a pull request makes.
        type: boolean
        default: true
      codeql-languages:
        description: >-
          JSON array of the CodeQL languages to analyse. CodeQL is one job per
          language, so the languages a change cannot affect are dropped from
          the matrix rather than from the job as a whole.
        type: string
        default: '["actions", "javascript-typescript", "rust"]'
  workflow_dispatch:
    inputs:
      run-actions:
        description: Scan the workflow definitions with zizmor
        type: boolean
        default: true
      run-cargo-deps:
        description: Audit the Cargo dependencies against RustSec
        type: boolean
        default: true
      run-dependency-review:
        description: Review the dependency changes a pull request makes
        type: boolean
        default: true
      codeql-languages:
        description: JSON array of the CodeQL languages to analyse
        type: string
        default: '["actions", "javascript-typescript", "rust"]'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  zizmor:
    if: inputs.run-actions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
  audit:
    if: inputs.run-cargo-deps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0436,RUSTSEC-2025-0134,RUSTSEC-2026-0097,RUSTSEC-2025-0141,RUSTSEC-2026-0258,RUSTSEC-2023-0089,RUSTSEC-2026-0192,RUSTSEC-2026-0206,RUSTSEC-2026-0253
          # RUSTSEC-2024-0436 = paste - no longer maintained
          # RUSTSEC-2025-0134 = rustls-pemfile is unmaintained, but only used in development dependencies
          # RUSTSEC-2025-0141 = bincode unmaintained, is done
          # RUSTSEC-2026-0097 = rand unsoundness with custom logger + rand::rng(); pinned by probabilistic-collections 0.7.0 (rand 0.7) and sqlx 0.8 (rand 0.8), neither have updates available
          # RUSTSEC-2026-0258 = h2 unbounded empty DATA frames dos; remaining leg is h2@0.3.27 pinned by actix-http (still on h2 "0.3" even at 3.13.3), no patched 0.3.x release exists
          # RUSTSEC-2023-0089 = atomic-polyfill unmaintained; only in Cargo.lock via geo-types' optional rstar 0.9/0.10 features, never compiled
          # RUSTSEC-2026-0192 = ttf-parser unmaintained; pinned by spreet 0.13.1 (latest) -> resvg 0.43, newer resvg moved to skrifa
          # RUSTSEC-2026-0206 = rustybuzz unmaintained; same spreet 0.13.1 -> resvg 0.43 pin
          # RUSTSEC-2026-0253 = lru@0.7.8 pop() panic safety; pulled in by tracing-log's interest-cache, whose keys never panic on drop
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && inputs.run-dependency-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false # incredibly high maintenance cost, also many false positives and not ability to ignore issues like "MIT/APACHE2" being used
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5
          allow-ghsas: GHSA-cq8v-f236-94qc # rand@0.7.3 unsoundness with custom logger; pinned by probabilistic-collections 0.7.0, cannot be upgraded
      # actions/dependency-review-action does not find all licenses -> we use cargo-deny for this in addition to dependency-review-action
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: inputs.codeql-languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
    - name: Restore the Rust extractor's cargo cache
      if: matrix.language == 'rust'
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/codeql-cargo-target
        key: codeql-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: codeql-rust-${{ runner.os }}-
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      env:
        CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-cargo-target
      with:
        category: "/language:${{matrix.language}}"
    - name: Save the Rust extractor's cargo cache
      if: matrix.language == 'rust' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/codeql-cargo-target
        key: codeql-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
