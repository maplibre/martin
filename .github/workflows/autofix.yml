name: autofix.ci # See https://autofix.ci/security why this name

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  push:
    branches: [ main ] # because cache-seeding

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  changes:
    name: Decide which jobs this change can affect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      cog-py: ${{ steps.filter.outputs.cog-py == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '.github/workflows/autofix.yml'
              - '.github/actions/setup-rust/**'
              - 'justfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - '**/*.rs'
              - 'schemas/**'
              - 'docs/content/files/generated_config.md'
              - 'martin/martin-ui/src/lib/types.gen.ts'
            cog-py:
              - '.github/workflows/autofix.yml'
              - 'Cargo.lock'
              - 'cog-tiles-py/**'

  fmt:
    name: Format and sync lock files
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    if: |
      github.event.action == 'opened' ||
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { components: rustfmt, tools: 'just,cargo-sort@2.1.3' } # 2.1.4 was re-published and no longer matches install-action's checksum
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with: { enable-cache: false } # uv is a one-off tool runner here; no Python deps to cache
      # The second run fails only on what the hooks cannot fix.
      - name: Run pre-commit hooks
        run: uvx prek@0.5.5 run --all-files || uvx prek@0.5.5 run --all-files
      # sync-biome-version above can change package.json.
      - name: Sync lock files
        if: ${{ !cancelled() }}
        run: |
          npm --prefix demo/frontend install --package-lock-only --no-fund
          npm --prefix martin/martin-ui install --package-lock-only --no-fund
      - name: Format Cargo.toml
        if: ${{ !cancelled() }}
        run: just fmt-toml
      - if: ${{ !cancelled() }}
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: {commit-message: "chore(fmt): apply formatting fixes and sync lock files"}

  gen-schemas:
    name: Generate config + OpenAPI schemas + UI types
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' && (
        github.event_name == 'push' ||
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened'
      )
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      # `just gen-schemas` builds with `rendering` so the OpenAPI doc covers
      # the static-render routes - that pulls in maplibre-native, whose C++
      # build needs the rendering toolchain installed.
      - uses: $/.github/actions/setup-rust
        with: { rendering: true, cache: true }
      - run: just gen-schemas
      # Run the pre-commit hooks so the generated JSON conforms to the repo's formatter
      # rules (trailing newline, etc.) - same tiebreaker the bless job uses.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with: { enable-cache: false } # uv is a one-off tool runner here; no Python deps to cache
      - run: uvx prek@0.5.5 run --files schemas/config.json schemas/openapi.json martin/martin-ui/src/lib/types.gen.ts
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: {commit-message: "chore: regenerate config + OpenAPI schemas + UI types"}

  cog-py-stubs:
    name: Regenerate the cog-tiles Python stub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: changes
    if: |
      needs.changes.outputs.cog-py == 'true' && (
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened'
      )
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
      - run: just sync-cog-py-stubs
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: {commit-message: "chore: regenerate the cog-tiles Python stub"}

  bless:
    name: Bless test output
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'bless'

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup Rust
        run: rustup update stable && rustup default stable

      - name: Install just
        uses: $/.github/actions/setup-rust
        with:
          toolchain: none
          tools: just,nextest,cargo-binstall,mlt

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install frontend dependencies
        run: npm clean-install --no-fund
        working-directory: martin/martin-ui

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3-tools
      - name: Install rendering dependencies
        run: just install-dependencies
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with: { enable-cache: false } # uv is a one-off tool runner here; no Python deps to cache

      - run: just bless

      # run the pre-commit hooks as a formatting tiebreaker
      - run: uvx prek@0.5.5 run --all-files
        continue-on-error: true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: {commit-message: "chore: update blessed test snapshots across all components"}
