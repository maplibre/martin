name: Rust CI

on:
  workflow_call:
    inputs:
      run-heavy:
        description: >-
          Run the jobs that only re-prove the Linux lane's coverage on another
          platform. Off for pull requests below the top of their stack.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run-heavy:
        description: Run the Windows/macOS builds and the publish dry-run
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  unit-test-rust:
    name: Unit test the server (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs:
      - lint-rust # not because it is needed, but because we want less concurrent jobs competing
    strategy:
      fail-fast: false
      matrix:
        # 1. Linux-only for PRs (faster feedback)
        # 2. Run on all three OS platforms when merging to main
        os: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with:
          tools: 'just,nextest'
          rendering: true
          # The 10GB cache quota only has room for the Linux entry; a macOS entry
          # gets evicted before the next run can restore it (see #3156).
          cache: ${{ matrix.os == 'ubuntu-latest' }}
          coverage: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Run the unit tests
        run: just test-packages-ci
      - run: just test-doc
      - if: matrix.os == 'ubuntu-latest'
        uses: $/.github/actions/upload-coverage
        with: { suite: unit }
  test-cog:
    name: COG GeoTIFF tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - lint-rust
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest', coverage: true }
      - name: Run COG tests
        run: just test-cog
      - uses: $/.github/actions/upload-coverage
        with: { suite: cog }
  test-duckdb:
    name: DuckDB GeoParquet tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - lint-rust
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest', cache: true, coverage: true }
      - name: Run DuckDB tests
        run: just test-duckdb
      - uses: $/.github/actions/upload-coverage
        with: { suite: duckdb }
  test-rendering:
    name: Style rendering tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - lint-rust
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest', rendering: true, cache: true, coverage: true }
      - name: Run rendering tests
        run: just test-rendering
      - uses: $/.github/actions/upload-coverage
        with: { suite: rendering }
  lint-rust:
    name: Lint the Rust code
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { components: clippy rustfmt, rendering: true, cache: true }
      - run: just clippy
  check-features:
    name: Check feature matrix (${{ matrix.partition }})
    permissions:
      contents: read
    # Depends on lint-rust not because it needs its output, but so the fan-out
    # of partitions doesn't compete for the early pipeline slots (only ~10 run
    # concurrently) before the cheaper clippy run has had a chance to fail fast.
    needs:
      - lint-rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [ 1/4, 2/4, 3/4, 4/4 ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { rendering: true, cache: true }
      - run: just check --partition ${{ matrix.partition }}
  lint-rust-dependencies:
    name: Lint Rust dependencies
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'cargo-shear,just' }
      - run: just shear
  build-aarch64-unknown-linux-musl:
    uses: $/.github/workflows/build-binary.yml
    with:
      target: aarch64-unknown-linux-musl
      os: ubuntu-latest
      musl: true
      release_mode: ${{ github.event_name != 'pull_request' }}

  build-x86_64-unknown-linux-musl:
    uses: $/.github/workflows/build-binary.yml
    with:
      target: x86_64-unknown-linux-musl
      os: ubuntu-latest
      musl: true
      release_mode: ${{ github.event_name != 'pull_request' }}

  docker-build-test:
    name: Build and test docker images
    runs-on: ubuntu-latest
    needs: [ build-aarch64-unknown-linux-gnu, build-x86_64-unknown-linux-gnu ]
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    env:
      # PG_* variables are used by psql
      PGDATABASE: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DOCKER_PLATFORMS: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      DOCKER_TEST_PLATFORMS: ${{ (github.event_name == 'release' || startsWith(github.head_ref, 'release-plz-')) && 'linux/arm64,linux/amd64' || 'linux/amd64' }}
    services:
      postgres:
        image: postgis/postgis:18-3.6
        ports:
          - 5432/tcp
        options: &postgis-ssl-options >-
          -e POSTGRES_DB=test
          -e POSTGRES_USER=postgres
          -e POSTGRES_PASSWORD=postgres
          -e PGDATABASE=test
          -e PGUSER=postgres
          -e PGPASSWORD=postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint sh
          postgis/postgis:18-3.6
          -c "exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Init database
        run: tests/fixtures/initdb.sh
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest,sqlx-cli,fast-mvt' }

      # we want to test our docker images before we push them to the registry
      # this is done by
      # - building multi-arch images
      # - executing the test script against each arch via docker
      # - pushing them to the registry
      #
      # We need the containerd image store, as otherwise multi-arch cannot be loaded => https://github.com/docker/buildx/blob/master/docs/reference/buildx_build.md#docker
      # > The default image store in Docker Engine doesn't support loading multi-platform images.
      # > You can enable the containerd image store, or push multi-platform images is to directly push to a registry
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up QEMU
        if: contains(env.DOCKER_PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        # https://github.com/docker/setup-qemu-action
        with: { platforms: 'linux/amd64,linux/arm64' }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        # https://github.com/docker/setup-buildx-action
        with: { install: true, platforms: "${{ env.DOCKER_PLATFORMS }}" }
      - name: Download build artifact build-aarch64-unknown-linux-gnu
        if: contains(env.DOCKER_PLATFORMS, 'arm64')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-aarch64-unknown-linux-gnu', path: 'target_releases/linux/arm64/' }
      - name: Mark target_releases/linux/arm64/* as executable
        if: contains(env.DOCKER_PLATFORMS, 'arm64')
        run: chmod +x target_releases/linux/arm64/*
      - name: Download build artifact build-x86_64-unknown-linux-gnu
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-x86_64-unknown-linux-gnu', path: 'target_releases/linux/amd64/' }
      - name: Mark target_releases/linux/amd64/* as executable
        run: chmod +x target_releases/linux/amd64/*
      - name: Prepare tag
        id: prepare_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="nightly"
          fi

          # Strip prefix "martin-v" if present
          echo "short_tag=${TAG#martin-v}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        # https://github.com/docker/metadata-action
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.prepare_tag.outputs.short_tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'martin-v') }}
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.authors=Yuri Astrakhan, Stepan Kuzmin and MapLibre contributors
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://maplibre.org/martin/
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version={{version}}
            org.opencontainers.image.vendor=maplibre
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
            org.opencontainers.image.description=Blazing fast and lightweight tile server with PostGIS, MBTiles, and PMTiles support
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/maplibre/martin
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.authors=Yuri Astrakhan, Stepan Kuzmin and MapLibre contributors
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://maplibre.org/martin/
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version={{version}}
            org.opencontainers.image.vendor=maplibre
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
            org.opencontainers.image.description=Blazing fast and lightweight tile server with PostGIS, MBTiles, and PMTiles support
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/maplibre/martin
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Build ${{ env.DOCKER_TEST_PLATFORMS }} Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        # https://github.com/docker/build-push-action
        with:
          provenance: mode=max
          sbom: true
          context: .
          file: .github/files/multi-platform.Dockerfile
          push: false
          load: true
          tags: ${{ github.repository }}:linux
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ env.DOCKER_TEST_PLATFORMS }}

      - name: Test linux/arm64 Docker image
        if: contains(env.DOCKER_TEST_PLATFORMS, 'arm64')
        run: |
          PLATFORM=linux/arm64
          TAG=${{ github.repository }}:linux
          # The tests hand martin absolute paths, both to checked-in fixtures and to the temp
          # directories they build their own in, so the workspace and the temp directory are
          # mounted where the host has them. The container runs as the runner so that the files
          # it writes into those directories stay ours to read and delete.
          RUN="--rm --net host --platform $PLATFORM --user $(id -u):$(id -g) -e DATABASE_URL -e DEFAULT_SRID -e AWS_REGION=eu-central-1 -e AWS_SKIP_CREDENTIALS=1 -e RUST_LOG_FORMAT=bare -e RUST_LOG -v $PWD:$PWD -v $TMPDIR:$TMPDIR -w $PWD"
          export MARTIN_BIN="docker run $RUN $TAG"
          export MARTIN_CP_BIN="docker run $RUN --entrypoint /usr/local/bin/martin-cp $TAG"
          export MBTILES_BIN="docker run $RUN --entrypoint /usr/local/bin/mbtiles $TAG"
          cargo nextest run --package martin-e2e-tests --features test-pg
        env:
          TMPDIR: /tmp
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services.postgres.ports[5432] }}/${{ env.PGDATABASE }}?sslmode=require
          # Seconds. Emulated containers start slowly, especially the first parallel
          # wave while QEMU and the image are cold; the default 60s is not enough.
          MARTIN_E2E_READY_TIMEOUT: 300
      - name: End-to-end tests against the linux/amd64 Docker image
        run: |
          PLATFORM=linux/amd64
          TAG=${{ github.repository }}:linux
          # The tests hand martin absolute paths, both to checked-in fixtures and to the temp
          # directories they build their own in, so the workspace and the temp directory are
          # mounted where the host has them. The container runs as the runner so that the files
          # it writes into those directories stay ours to read and delete.
          RUN="--rm --net host --platform $PLATFORM --user $(id -u):$(id -g) -e DATABASE_URL -e DEFAULT_SRID -e AWS_REGION=eu-central-1 -e AWS_SKIP_CREDENTIALS=1 -e RUST_LOG_FORMAT=bare -e RUST_LOG -v $PWD:$PWD -v $TMPDIR:$TMPDIR -w $PWD"
          export MARTIN_BIN="docker run $RUN $TAG"
          export MARTIN_CP_BIN="docker run $RUN --entrypoint /usr/local/bin/martin-cp $TAG"
          export MBTILES_BIN="docker run $RUN --entrypoint /usr/local/bin/mbtiles $TAG"
          cargo nextest run --package martin-e2e-tests --features test-pg
        env:
          TMPDIR: /tmp
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services.postgres.ports[5432] }}/${{ env.PGDATABASE }}?sslmode=require

      - name: Login to GitHub Docker registry
        if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'martin-v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        # https://github.com/docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the Docker image
        id: docker_push
        if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'martin-v'))
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          provenance: mode=max
          sbom: true
          context: .
          file: .github/files/multi-platform.Dockerfile
          push: true
          load: false
          tags: ${{ steps.docker_meta.outputs.tags }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: Attest
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_push.outputs.digest }}
          push-to-registry: true

  build-aarch64-apple-darwin:
    if: inputs.run-heavy
    uses: $/.github/workflows/build-binary.yml
    with:
      target: aarch64-apple-darwin
      os: macos-latest # M-series CPU
      release_mode: ${{ github.event_name != 'pull_request' }}

  build-debian-x86_64:
    uses: $/.github/workflows/build-binary.yml
    with:
      target: debian-x86_64
      # downgraded to have lower libc support. Debian-12 (stable at the time of writing) does not support the same version ubuntu does.
      # TODO: update to ubuntu-latest again once debian 13 launches
      os: ubuntu-22.04
      release_mode: ${{ github.event_name != 'pull_request' }}

  build-x86_64-pc-windows-msvc:
    if: inputs.run-heavy
    uses: $/.github/workflows/build-binary.yml
    with:
      target: x86_64-pc-windows-msvc
      os: windows-latest
      release_mode: ${{ github.event_name != 'pull_request' }}

  build-x86_64-unknown-linux-gnu:
    uses: $/.github/workflows/build-binary.yml
    with:
      target: x86_64-unknown-linux-gnu
      os: ubuntu-latest
      release_mode: ${{ github.event_name != 'pull_request' }}

  build-aarch64-unknown-linux-gnu:
    uses: $/.github/workflows/build-binary.yml
    with:
      target: aarch64-unknown-linux-gnu
      os: ubuntu-24.04-arm
      release_mode: ${{ github.event_name != 'pull_request' }}

  test-aws-lambda:
    name: Test AWS Lambda
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ build-x86_64-unknown-linux-musl ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { toolchain: none }
      - name: Download build artifact build-x86_64-unknown-linux-musl
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-x86_64-unknown-linux-musl', path: 'target/' }
      - run: just test-lambda target/martin

  test-multi-os:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs: [ build-x86_64-pc-windows-msvc, build-x86_64-unknown-linux-gnu, build-debian-x86_64 ]
    if: |
      !cancelled()
      && needs.build-x86_64-unknown-linux-gnu.result == 'success'
      && needs.build-debian-x86_64.result == 'success'
      && needs.build-x86_64-pc-windows-msvc.result != 'failure'
    env:
      # PG_* variables are used by psql
      PGDATABASE: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 34837
      # AWS variables for S3 access
      AWS_REGION: eu-central-1
      AWS_SKIP_CREDENTIALS: 1
    strategy:
      fail-fast: true
      matrix:
        include: ${{ inputs.run-heavy && fromJSON('[{"target":"x86_64-pc-windows-msvc","os":"windows-latest","ext":".exe"},{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"}]') || fromJSON('[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"}]') }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set up sqlite3-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y sqlite3-tools
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest,fast-mvt', rendering: true, cache: true }
      - name: Install sqlite3 and sqldiff on Windows
        if: matrix.os == 'windows-latest'
        run: choco install sqlite --yes
        shell: powershell
      - name: Install and run Postgis (Windows)
        if: matrix.os == 'windows-latest'
        uses: nyurik/action-setup-postgis@e54fc643200ee809b4711c3f537c433dfbeba056 # v2.3
        id: pg
        with: { username: 'postgres', password: 'postgres', database: 'test', postgres-version: 16, port: 34837, postgis_version: 3.5.2 }
      - name: Install and run Postgis (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d \
          -p 34837:5432 \
          -e POSTGRES_DB=test \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e PGDATABASE=test \
          -e PGUSER=postgres \
          -e PGPASSWORD=postgres \
          --health-cmd="pg_isready" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=5 \
          postgis/postgis:18-3.6 \
          postgres \
          -c ssl=on \
          -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem  \
          -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - name: Init database
        env:
          PG_SERVICE_NAME: ${{ steps.pg.outputs.service-name }}
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export DATABASE_URL="postgres://${PGUSER}:${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require"
          else
            export PGSERVICE="${PG_SERVICE_NAME}"
          fi
          tests/fixtures/initdb.sh
      - name: Download build artifact build-${{ matrix.target }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.target }}
          path: target/

      - name: End-to-end tests
        run: |
          export MARTIN_BIN=target/martin${{ matrix.ext }}
          export MARTIN_CP_BIN=target/martin-cp${{ matrix.ext }}
          export MBTILES_BIN=target/mbtiles${{ matrix.ext }}
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$MARTIN_BIN" "$MARTIN_CP_BIN" "$MBTILES_BIN"
          fi
          if [ "$RUNNER_OS" == "Linux" ]; then
            export DATABASE_URL="postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ env.PGPORT }}/${{ env.PGDATABASE }}?sslmode=require"
            cargo nextest run --package martin-e2e-tests --features test-pg
          else
            export DATABASE_URL="${STEPS_PG_OUTPUTS_CONNECTION_URI}"
            # Windows runs the PostGIS that the setup action ships, which encodes geometry
            # differently than the one behind the snapshots, so the database tests that run here
            # are the ones asserting on what martin logs and publishes.
            cargo nextest run --package martin-e2e-tests
            cargo nextest run --package martin-e2e-tests --features test-pg --test config_file
          fi
        env:
          STEPS_PG_OUTPUTS_CONNECTION_URI: ${{ steps.pg.outputs.connection-uri }}
      - name: Download Debian package (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-debian-x86_64', path: 'target/' }
      - name: End-to-end tests against the Debian package (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo dpkg -i target/debian-x86_64.deb
          export MARTIN_BIN=/usr/bin/martin${{ matrix.ext }}
          export MARTIN_CP_BIN=/usr/bin/martin-cp${{ matrix.ext }}
          export MBTILES_BIN=/usr/bin/mbtiles${{ matrix.ext }}
          cargo nextest run --package martin-e2e-tests --features test-pg
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ env.PGPORT }}/${{ env.PGDATABASE }}?sslmode=require

  unit-test-svc-pg:
    name: Unit test against PostGIS variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: &pg-env
      PGDATABASE: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      pg11-alpine:
        image: postgis/postgis:13-3.0-alpine
        ports:
          - 5432/tcp
        env: &postgis-env
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          PGDATABASE: test
          PGUSER: postgres
          PGPASSWORD: postgres
        options: &postgis-options >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pg18-alpine:
        image: postgis/postgis:18-3.6-alpine
        ports:
          - 5432/tcp
        env: *postgis-env
        options: *postgis-options
      # alpine images don't support SSL, so for sslmode=require we use the debian image
      pg18-ssl:
        image: postgis/postgis:18-3.6
        ports:
          - 5432/tcp
        options: *postgis-ssl-options
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest', rendering: true, coverage: true }
      - parallel:
          - name: Init pg11-alpine database
            run: tests/fixtures/initdb.sh
            env:
              PGPORT: ${{ job.services['pg11-alpine'].ports[5432] }}
          - name: Init pg18-alpine database
            run: tests/fixtures/initdb.sh
            env:
              PGPORT: ${{ job.services['pg18-alpine'].ports[5432] }}
          - name: Init pg18-ssl database
            run: tests/fixtures/initdb.sh
            env:
              PGPORT: ${{ job.services['pg18-ssl'].ports[5432] }}
      - name: Unit Tests postgis:11-3.0-alpine sslmode=disable
        run: |
          echo "Running unit tests, connecting to DATABASE_URL=$DATABASE_URL"
          just test-pg
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services['pg11-alpine'].ports[5432] }}/${{ env.PGDATABASE }}?sslmode=disable
      - name: Unit Tests postgis:18-3.6-alpine sslmode=disable
        run: |
          echo "Running unit tests, connecting to DATABASE_URL=$DATABASE_URL"
          just test-pg
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services['pg18-alpine'].ports[5432] }}/${{ env.PGDATABASE }}?sslmode=disable
      - name: Unit Tests postgis:18-3.6 sslmode=require
        run: |
          echo "Running unit tests, connecting to DATABASE_URL=$DATABASE_URL"
          just test-pg
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services['pg18-ssl'].ports[5432] }}/${{ env.PGDATABASE }}?sslmode=require
      - uses: $/.github/actions/upload-coverage
        with: { suite: pg }

  unit-test-svc-minio:
    # Exercises the PmtilesReloader's S3-prefix polling against a MinIO testcontainer
    # via Martin's public HTTP API. Docker is preinstalled on GitHub-hosted runners,
    # which is all the testcontainers crate needs.
    name: Unit test against MinIO (S3-compatible)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest', coverage: true }
      - name: Unit Tests
        run: just test-minio
      - uses: $/.github/actions/upload-coverage
        with: { suite: minio }

  test-with-svc:
    name: Test postgis:${{ matrix.img_ver }} sslmode=${{ matrix.sslmode }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ build-x86_64-unknown-linux-gnu, build-debian-x86_64, unit-test-svc-pg ]
    strategy:
      fail-fast: true
      matrix:
        include:
          # These must match the versions of postgres used in the docker-compose.yml
          - img_ver: 11-3.0-alpine
            args: postgres
            sslmode: disable
          - img_ver: 18-3.6-alpine
            args: postgres
            sslmode: disable
          # alpine images don't support SSL, so for this we use the debian images
          - img_ver: 18-3.6
            args: postgres -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
            sslmode: require
          #
          # FIXME!
          # DISABLED because Rustls fails to validate name (CN?) with the NotValidForName error
          #- img_ver: 15-3.3
          #  args: postgres -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          #  sslmode: verify-ca
          #- img_ver: 15-3.3
          #  args: postgres -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          #  sslmode: verify-full
    env: *pg-env
    services:
      postgres:
        image: postgis/postgis:${{ matrix.img_ver }}
        ports:
          - 5432/tcp
        options: >-
          -e POSTGRES_DB=test
          -e POSTGRES_USER=postgres
          -e POSTGRES_PASSWORD=postgres
          -e PGDATABASE=test
          -e PGUSER=postgres
          -e PGPASSWORD=postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint sh
          postgis/postgis:${{ matrix.img_ver }}
          -c "exec docker-entrypoint.sh ${{ matrix.args }}"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Init database
        run: tests/fixtures/initdb.sh
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
      - name: Get DB SSL cert (sslmode=verify-*)
        if: matrix.sslmode == 'verify-ca' || matrix.sslmode == 'verify-full'
        run: |
          set -x
          mkdir -p target/certs
          docker cp ${JOB_SERVICES_POSTGRES_ID}:/etc/ssl/certs/ssl-cert-snakeoil.pem target/certs/server.crt
          docker cp ${JOB_SERVICES_POSTGRES_ID}:/etc/ssl/private/ssl-cert-snakeoil.key target/certs/server.key
        env:
          JOB_SERVICES_POSTGRES_ID: ${{ job.services.postgres.id }}
      - name: Download build artifact build-x86_64-unknown-linux-gnu
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-x86_64-unknown-linux-gnu', path: 'target_releases/' }
      - name: Set up sqlite3-tools
        run: sudo apt update && sudo apt-get install -y sqlite3-tools
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,nextest,fast-mvt', rendering: true }
      # This job is about reaching each PostGIS version over each sslmode. The tests that assert
      # on tile contents are pinned to the PostGIS behind docker-compose and run in the jobs
      # using that image, so what runs here is the slice that only needs a database to talk to.
      - name: End-to-end database tests
        run: |
          if [[ "${{ matrix.sslmode }}" == "verify-ca" || "${{ matrix.sslmode }}" == "verify-full" ]]; then
            export PGSSLROOTCERT=target/certs/server.crt
          fi
          export MARTIN_BIN=target_releases/martin
          export MARTIN_CP_BIN=target_releases/martin-cp
          export MBTILES_BIN=target_releases/mbtiles
          chmod +x "$MARTIN_BIN" "$MARTIN_CP_BIN" "$MBTILES_BIN"
          cargo nextest run --package martin-e2e-tests --features test-pg --test config_file
          rm -rf target_releases
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services.postgres.ports[5432] }}/${{ env.PGDATABASE }}?sslmode=${{ matrix.sslmode }}
      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: 'build-debian-x86_64', path: 'target_releases/' }
      - name: End-to-end database tests against the Debian package
        run: |
          sudo dpkg -i target_releases/debian-x86_64.deb
          if [[ "${{ matrix.sslmode }}" == "verify-ca" || "${{ matrix.sslmode }}" == "verify-full" ]]; then
            export PGSSLROOTCERT=target/certs/server.crt
          fi
          export MARTIN_BIN=/usr/bin/martin
          export MARTIN_CP_BIN=/usr/bin/martin-cp
          export MBTILES_BIN=/usr/bin/mbtiles
          cargo nextest run --package martin-e2e-tests --features test-pg --test config_file
          sudo dpkg -P martin
          rm -rf target_releases
        env:
          DATABASE_URL: postgres://${{ env.PGUSER }}:${{ env.PGUSER }}@${{ env.PGHOST }}:${{ job.services.postgres.ports[5432] }}/${{ env.PGDATABASE }}?sslmode=${{ matrix.sslmode }}

  test-publish:
    name: Test publishing via cargo-publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A from-scratch package and build of the whole workspace. What it guards
    # is the release itself, so on pull requests it only runs for the one
    # release-plz opens; pushes and releases always run it.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup-rust
        with: { tools: 'just,cargo-binstall', rendering: true }
      - name: Test packaging
        run: cargo publish --workspace --dry-run
      - name: Test cargo-binstall metadata
        run: just check-binstall

  coverage:
    name: Merge and upload code coverage
    runs-on: ubuntu-latest
    needs:
      - unit-test-rust
      - test-cog
      - test-duckdb
      - test-rendering
      - unit-test-svc-pg
      - unit-test-svc-minio
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Download the per-suite lcov reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: 'coverage-*', merge-multiple: true, path: 'target/coverage' }
      - uses: $/.github/actions/setup-rust
        with: { toolchain: none, tools: 'just,grcov' }
      - name: Merge the reports into one Cobertura report
        run: just coverage-merge
      - name: Upload to GitHub code coverage
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: target/cobertura.xml
          language: Rust
          label: code-coverage/llvm-cov
