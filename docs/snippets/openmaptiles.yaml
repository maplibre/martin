shapefile:
  sources:
    ocean:
      path: water-polygons-split-3857.zip
      maxzoom: 14
      layers:
        ocean:
          layer: water
          geometry: polygon
          buffer: 64
          attributes:
            class: { value: ocean }
          merge_polygons:
            - { maxzoom: 13, min_area: 1 }
            - { minzoom: 14, min_area: 0.0625 }
osm:
  sources:
    openmaptiles:
      path: berlin-latest.osm.pbf
      maxzoom: 14
      tags:
        - name
        - int_name
        - "name:af"
        - "name:am"
        - "name:ar"
