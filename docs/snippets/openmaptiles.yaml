        - "name:pa"
        - "name:pnb"
        - "name:pl"
        - "name:pt"
        - "name:rm"
        - "name:ro"
        - "name:ru"
        - "name:sk"
        - "name:sl"
        - "name:sq"
        - "name:sr"
        - "name:sr-Latn"
        - "name:sv"
