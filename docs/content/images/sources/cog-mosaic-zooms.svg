<svg id="cog-mosaic-zooms" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="100%" role="img" aria-label="With zoom 16 and maxzoom 20, a mosaic serves zooms 16 to 20; tiles below zoom 16 or beyond a file's own images are empty"><title>With zoom 16 and maxzoom 20, a mosaic serves zooms 16 to 20; tiles below zoom 16 or beyond a file's own images are empty</title><style>#cog-mosaic-zooms{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#cog-mosaic-zooms .fg{fill:var(--md-default-fg-color,#000000de)}#cog-mosaic-zooms .muted{fill:var(--md-default-fg-color--light,#0000008a)}#cog-mosaic-zooms .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#cog-mosaic-zooms .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#cog-mosaic-zooms .head{fill:var(--md-default-fg-color--light,#0000008a)}#cog-mosaic-zooms text{dominant-baseline:central}#cog-mosaic-zooms .t{font-weight:600}#cog-mosaic-zooms .s{font-size:11px}#cog-mosaic-zooms .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#cog-mosaic-zooms .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#cog-mosaic-zooms .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-mosaic-zooms .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-mosaic-zooms .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#cog-mosaic-zooms .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#cog-mosaic-zooms .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#cog-mosaic-zooms .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#cog-mosaic-zooms .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#cog-mosaic-zooms .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#cog-mosaic-zooms .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg mono" x="40" y="24" text-anchor="start">zoom: 16, maxzoom: 20, files with zooms 16 to 19</text><rect class="ghost" x="40" y="56" width="36" height="36" rx="0"/><text class="muted s" x="58.0" y="74.0" text-anchor="middle">0</text><rect class="ghost" x="80" y="56" width="36" height="36" rx="0"/><text class="muted s" x="98.0" y="74.0" text-anchor="middle">1</text><rect class="ghost" x="120" y="56" width="36" height="36" rx="0"/><text class="muted s" x="138.0" y="74.0" text-anchor="middle">2</text><rect class="ghost" x="160" y="56" width="36" height="36" rx="0"/><text class="muted s" x="178.0" y="74.0" text-anchor="middle">3</text><rect class="ghost" x="200" y="56" width="36" height="36" rx="0"/><text class="muted s" x="218.0" y="74.0" text-anchor="middle">4</text><rect class="ghost" x="240" y="56" width="36" height="36" rx="0"/><text class="muted s" x="258.0" y="74.0" text-anchor="middle">5</text><rect class="ghost" x="280" y="56" width="36" height="36" rx="0"/><text class="muted s" x="298.0" y="74.0" text-anchor="middle">6</text><rect class="ghost" x="320" y="56" width="36" height="36" rx="0"/><text class="muted s" x="338.0" y="74.0" text-anchor="middle">7</text><rect class="ghost" x="360" y="56" width="36" height="36" rx="0"/><text class="muted s" x="378.0" y="74.0" text-anchor="middle">8</text><rect class="ghost" x="400" y="56" width="36" height="36" rx="0"/><text class="muted s" x="418.0" y="74.0" text-anchor="middle">9</text><rect class="ghost" x="440" y="56" width="36" height="36" rx="0"/><text class="muted s" x="458.0" y="74.0" text-anchor="middle">10</text><rect class="ghost" x="480" y="56" width="36" height="36" rx="0"/><text class="muted s" x="498.0" y="74.0" text-anch