<svg id="cog-reload" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="How Martin notices a changed COG depends on where it is: filesystem events for local directories, polling for remote files and prefixes, the file cache for mosaics, nothing for local files"><title>How Martin notices a changed COG depends on where it is: filesystem events for local directories, polling for remote files and prefixes, the file cache for mosaics, nothing for local files</title><style>#cog-reload{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#cog-reload .fg{fill:var(--md-default-fg-color,#000000de)}#cog-reload .muted{fill:var(--md-default-fg-color--light,#0000008a)}#cog-reload .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#cog-reload .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#cog-reload .head{fill:var(--md-default-fg-color--light,#0000008a)}#cog-reload text{dominant-baseline:central}#cog-reload .t{font-weight:600}#cog-reload .s{font-size:11px}#cog-reload .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#cog-reload .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#cog-reload .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-reload .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-reload .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#cog-reload .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#cog-reload .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#cog-reload .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#cog-reload .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#cog-reload .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#cog-reload .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg s t" x="40" y="24" text-anchor="start">where the COG is</text><text class="fg s t" x="360" y="24" text-anchor="start">how a change is noticed</text><text class="fg s t" x="720" y="24" text-anchor="start">when</text><rect class="box" x="40" y="44" width="280" height="44" rx="0"/><text class="fg t s" x="52" y="58" text-anchor="start">local directory</text><text class="muted s" x="52" y="75" text-anchor="start">directory in cog.paths</text><path class="arrow" d="M328 66 L352 66"/><path class="head" d="M352 66 L344.0 70.0 L344.0 62.0 Z"/><rect class="hi" x="360" y="44" width="320" height="44" rx="0"/><text class="fg t s" x="372" y="58" text-anchor="start">filesystem event</text><text class="muted s" x="372" y="75" text-anchor="start">file added, modified, or removed</text><text class="fg s t" x="720" y="66" text-anchor="start">at once</text><rect class="box" x="40" y="100" width="280" height="44" rx="0"/><text class="fg t s" x="52" y="114" text-anchor="start">local file</text><text class="muted s" x="52" y="131" text-anchor="start">file in cog.paths or cog.sources</text><path class="arrow" d="M328 122 L352 122"/><path class="head" d="M352 122 L344.0 126.0 L344.0 118.0 Z"/><rect class="ghost" x="360" y="100" width="320" height="44" rx="0"/><text class="fg t s" x="372" y="114" text-anchor="start">not watched</text><text class="muted s" x="372" y="131" text-anchor="start">loaded at startup only</text><text class="muted s" x="720" y="122" text-anchor="start">at restart</text><rect class="box" x="40" y="156" width="280" height="44" rx="0"/><text class="fg t s" x="52" y="170" text-anchor="start">remote file</text><text class="muted s" x="52" y="187" text-anchor="start">URL in cog.paths, cog.sources, or the CLI</text><path class="arrow" d="M328 178 L352 178"/><path class="head" d="M352 178 L344.0 182.0 L344.0 174.0 Z"/><rect class="hi" x="360" y="156" width="320" height="44" rx="0"/><text class="fg t s" x="372" y="170" text-anchor="start">HEAD request</text><text class="muted s" x="372" y="187" text-anchor="start">rebuilt when ETag or Last-Modified changes</text><text class="fg s t" x="720" y="178" text-anchor="start">every reload_interval</text><rect class="box" x="40" y="212" width="280" height="44" rx="0"/><text class="fg t s" x="52" y="226" text-anchor="start">remote prefix</text><text class="muted s" x="52" y="243" text-anchor="start">prefix in cog.paths</text><path class="arrow" d="M328 234 L352 234"/><path class="head" d="M352 234 L344.0 238.0 L344.0 230.0 Z"/><rect class="hi" x="360" y="212" width="320" height="44" rx="0"/><text class="fg t s" x="372" y="226" text-anchor="start">prefix listing</text><text class="muted s" x="372" y="243" text-anchor="start">compared with the last listing</text><text class="fg s t" x="720" y="234" text-anchor="start">every reload_interval</text><rect class="box" x="40" y="268" width="280" height="44" rx="0"/><text class="fg t s" x="52" y="282" text-anchor="start">mosaic</text><text class="muted s" x="52" y="299" text-anchor="start">mosaic in cog.mosaics</text><path class="arrow" d="M328 290 L352 290"/><path class="head" d="M352 290 L344.0 294.0 L344.0 286.0 Z"/><rect class="hi" x="360" y="268" width="320" height="44" rx="0"/><text class="fg t s" x="372" y="282" text-anchor="start">file cache entry expires</text><text class="muted s" x="372" y="299" text-anchor="start">file opened again on next use</text><text class="fg s t" x="720" y="290" text-anchor="start">after file_expiry</text></svg>
