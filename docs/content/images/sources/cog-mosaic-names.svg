<svg id="cog-mosaic-names" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="100%" role="img" aria-label="A quadkey adds one digit per zoom; {x} and {y} count from the top-left, {-y} counts rows from the bottom"><title>A quadkey adds one digit per zoom; {x} and {y} count from the top-left, {-y} counts rows from the bottom</title><style>#cog-mosaic-names{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#cog-mosaic-names .fg{fill:var(--md-default-fg-color,#000000de)}#cog-mosaic-names .muted{fill:var(--md-default-fg-color--light,#0000008a)}#cog-mosaic-names .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#cog-mosaic-names .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#cog-mosaic-names .head{fill:var(--md-default-fg-color--light,#0000008a)}#cog-mosaic-names text{dominant-baseline:central}#cog-mosaic-names .t{font-weight:600}#cog-mosaic-names .s{font-size:11px}#cog-mosaic-names .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#cog-mosaic-names .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#cog-mosaic-names .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-mosaic-names .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#cog-mosaic-names .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#cog-mosaic-names .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#cog-mosaic-names .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#cog-mosaic-names .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#cog-mosaic-names .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#cog-mosaic-names .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#cog-mosaic-names .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg s t" x="40" y="30" text-anchor="start">{quadkey}: one digit per zoom level</text><rect class="hi" x="40.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="80.0" y="94.0" text-anchor="middle">0</text><rect class="box" x="120.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="160.0" y="94.0" text-anchor="middle">1</text><rect class="box" x="40.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="80.0" y="174.0" text-anchor="middle">2</text><rect class="box" x="120.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="160.0" y="174.0" text-anchor="middle">3</text><text class="muted s" x="120.0" y="232" text-anchor="middle">zoom 1</text><rect class="box" x="240.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="280.0" y="94.0" text-anchor="middle">00</text><rect class="box" x="320.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="360.0" y="94.0" text-anchor="middle">01</text><rect class="box" x="240.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="280.0" y="174.0" text-anchor="middle">02</text><rect class="hi" x="320.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="360.0" y="174.0" text-anchor="middle">03</text><text class="muted s" x="320" y="232" text-anchor="middle">zoom 2</text><rect class="box" x="440.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="480.0" y="94.0" text-anchor="middle">030</text><rect class="hi" x="520.0" y="54.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="560.0" y="94.0" text-anchor="middle">031</text><rect class="box" x="440.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="480.0" y="174.0" text-anchor="middle">032</text><rect class="box" x="520.0" y="134.0" width="80.0" height="80.0" rx="0"/><text class="muted mono" x="560.0" y="174.0" text-anchor="middle">033</text><text class="muted s" x="520" y="232" text-anchor="middle">zoom 3</text><path class="arrow" d="M206 94 L234 94"/><path class="head" d="M234 94 L226.0 98.0 L226.0 90.0 Z"/><path class="arrow" d="M406 174 L434 174"/><path class="head" d="M434 174 L426.0 178.0 L426.0 170.0 Z"/><text class="muted s" x="320" y="254" text-anchor="middle">0 = NW, 1 = NE, 2 = SW, 3 = SE</text><text class="fg s t" x="620" y="30" text-anchor="start">{y} and {-y} at zoom 2</text><rect class="box" x="660" y="54" width="40" height="40" rx="0"/><text class="muted mono" x="640" y="74" text-anchor="middle">0</text><text class="muted mono" x="720" y="74" text-anchor="middle">3</text><rect class="box" x="660" y="94" width="40" height="40" rx="0"/><text class="muted mono" x="640" y="114" text-anchor="middle">1</text><text class="muted mono" x="720" y="114" text-anchor="middle">2</text><rect class="box" x="660" y="134" width="40" height="40" rx="0"/><text class="muted mono" x="640" y="154" text-anchor="middle">2</text><text class="muted mono" x="720" y="154" text-anchor="middle">1</text><rect class="box" x="660" y="174" width="40" height="40" rx="0"/><text class="muted mono" x="640" y="194" text-anchor="middle">3</text><text class="muted mono" x="720" y="194" text-anchor="middle">0</text><text class="fg mono" x="640" y="232" text-anchor="middle">{y}</text><text class="fg mono" x="720" y="232" text-anchor="middle">{-y}</text><text class="muted s" x="760" y="74" text-anchor="start">{y}: from the top (XYZ)</text><text class="muted s" x="760" y="194" text-anchor="start">{-y}: from the bottom (TMS)</text><text class="muted s" x="760" y="134" text-anchor="start">{-y} = 2^z - 1 - {y}</text><text class="fg s t" x="40" y="276" text-anchor="start">one zoom 16 tile, three path templates</text><text class="fg mono" x="40" y="296" text-anchor="start">{quadkey}.tif = 0313131311301120.tif</text><text class="fg mono" x="360" y="296" text-anchor="start">{z}/{x}/{y}.tif = 16/32748/21794.tif</text><text class="fg mono" x="680" y="296" text-anchor="start">{x}-{-y}.tif = 32748-43741.tif</text></svg>
