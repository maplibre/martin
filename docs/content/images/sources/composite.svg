<svg id="composite" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" role="img" aria-label="Requesting points,lines, or an alias that lists both, returns one tile holding a points layer and a lines layer"><title>Requesting points,lines, or an alias that lists both, returns one tile holding a points layer and a lines layer</title><style>#composite{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#composite .fg{fill:var(--md-default-fg-color,#000000de)}#composite .muted{fill:var(--md-default-fg-color--light,#0000008a)}#composite .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#composite .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#composite .head{fill:var(--md-default-fg-color--light,#0000008a)}#composite text{dominant-baseline:central}#composite .t{font-weight:600}#composite .s{font-size:11px}#composite .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#composite .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#composite .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#composite .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#composite .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#composite .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#composite .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#composite .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#composite .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#composite .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#composite .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="box" x="40" y="40" width="170" height="60" rx="4"/><text class="fg t mono" x="125" y="70" text-anchor="middle">points</text><rect class="box" x="40" y="130" width="170" height="60" rx="4"/><text class="fg t mono" x="125" y="160" text-anchor="middle">lines</text><path class="arrow" d="M210 70 L240 70 L240 160 L210 160"/><path class="arrow" d="M240 115 L240 65 L270 65"/><path class="head" d="M270 65 L262.0 69.0 L262.0 61.0 Z"/><path class="arrow" d="M240 115 L240 165 L270 165"/><path class="head" d="M270 165 L262.0 169.0 L262.0 161.0 Z"/><rect class="hi" x="272" y="48" width="270" height="34" rx="17"/><text class="fg mono" x="407" y="65" text-anchor="middle">GET /points,lines/{z}/{x}/{y}</text><text class="muted s" x="407" y="100" text-anchor="middle">composite</text><rect class="hi" x="272" y="148" width="270" height="34" rx="17"/><text class="fg mono" x="407" y="165" text-anchor="middle">GET /basemap/{z}/{x}/{y}</text><text class="muted s" x="407" y="200" text-anchor="middle">alias</text><path class="arrow" d="M542 65 L580 65 L580 115 L610 115"/><path class="head" d="M610 115 L602.0 119.0 L602.0 111.0 Z"/><path class="arrow" d="M542 165 L580 165 L580 115 L610 115"/><path class="head" d="M610 115 L602.0 119.0 L602.0 111.0 Z"/><rect class="box" x="612" y="30" width="308" height="170" rx="4"/><text class="fg t" x="624" y="48" text-anchor="start">one tile</text><rect class="hi" x="624" y="66" width="136" height="120" rx="4"/><text class="fg s mono" x="692" y="82" text-anchor="middle">layer points</text><circle class="accdot" cx="654" cy="122" r="5"/><circle class="accdot" cx="694" cy="142" r="5"/><circle class="accdot" cx="724" cy="112" r="5"/><circle class="accdot" cx="674" cy="167" r="5"/><circle class="accdot" cx="739" cy="157" r="5"/><rect class="hi" x="772" y="66" width="136" height="120" rx="4"/><text class="fg s mono" x="840" y="82" text-anchor="middle">layer lines</text><path class="accline" d="M786 170 L822 130 L852 148 L894 102"/><path class="accline" d="M786 112 L832 122 L892 170"/><text class="muted s" x="766" y="222" text-anchor="middle">one source-layer per source</text></svg>
