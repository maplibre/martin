<svg id="pg-sslmode" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" role="img" aria-label="What each sslmode guarantees: disable encrypts nothing, allow and prefer encrypt only if the server insists or supports it, require always encrypts, verify-ca also checks the certificate and verify-full also checks the hostname; allow and verify-full are recommended, prefer is the default"><title>What each sslmode guarantees: disable encrypts nothing, allow and prefer encrypt only if the server insists or supports it, require always encrypts, verify-ca also checks the certificate and verify-full also checks the hostname; allow and verify-full are recommended, prefer is the default</title><style>#pg-sslmode{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#pg-sslmode .fg{fill:var(--md-default-fg-color,#000000de)}#pg-sslmode .muted{fill:var(--md-default-fg-color--light,#0000008a)}#pg-sslmode .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#pg-sslmode .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#pg-sslmode .head{fill:var(--md-default-fg-color--light,#0000008a)}#pg-sslmode text{dominant-baseline:central}#pg-sslmode .t{font-weight:600}#pg-sslmode .s{font-size:11px}#pg-sslmode .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#pg-sslmode .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#pg-sslmode .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pg-sslmode .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pg-sslmode .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#pg-sslmode .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#pg-sslmode .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#pg-sslmode .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#pg-sslmode .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#pg-sslmode .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#pg-sslmode .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#pg-sslmode .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="apron" x="322" y="4" width="116" height="200" rx="10"/><text class="fg s t" x="380" y="186" text-anchor="middle">recommended</text><rect class="apron" x="802" y="4" width="116" height="200" rx="10"/><text class="fg s t" x="860" y="186" text-anchor="middle">recommended</text><text class="muted s" x="500" y="186" text-anchor="middle">default</text><text class="fg t mono" x="260" y="20" text-anchor="middle">disable</text><text class="fg t mono" x="380" y="20" text-anchor="middle">allow</text><text class="fg t mono" x="500" y="20" text-anchor="middle">prefer</text><text class="fg t mono" x="620" y="20" text-anchor="middle">require</text><text class="fg t mono" x="740" y="20" text-anchor="middle">verify-ca</text><text class="fg t mono" x="860" y="20" text-anchor="middle">verify-full</text><text class="fg s t" x="40" y="56" text-anchor="start">encrypted</text><rect class="ghost" x="208" y="42" width="104" height="28" rx="14"/><text class="muted s" x="260" y="56" text-anchor="middle"></text><rect class="hi" x="328" y="42" width="104" height="28" rx="14"/><text class="muted s" x="380" y="56" text-anchor="middle">if server insists</text><rect class="hi" x="448" y="42" width="104" height="28" rx="14"/><text class="muted s" x="500" y="56" text-anchor="middle">if server supports</text><rect class="sel" x="568" y="42" width="104" height="28" rx="14"/><text class="fg s" x="620" y="56" text-anchor="middle">yes</text><rect class="sel" x="688" y="42" width="104" height="28" rx="14"/><text class="fg s" x="740" y="56" text-anchor="middle">yes</text><rect class="sel" x="808" y="42" width="104" height="28" rx="14"/><text class="fg s" x="860" y="56" text-anchor="middle">yes</text><text class="fg s t" x="40" y="100" text-anchor="start">certificate checked</text><rect class="ghost" x="208" y="86" width="104" height="28" rx="14"/><text class="muted s" x="260" y="100" text-anchor="middle"></text><rect class="ghost" x="328" y="86" width="104" height="28" rx="14"/><text class="muted s" x="380" y="100" text-anchor="middle"></text><rect class="ghost" x="448" y="86" width="104" height="28" rx="14"/><text class="muted s" x="500" y="100" text-anchor="middle"></text><rect class="ghost" x="568" y="86" width="104" height="28" rx="14"/><text class="muted s" x="620" y="100" text-anchor="middle"></text><rect class="sel" x="688" y="86" width="104" height="28" rx="14"/><text class="fg s" x="740" y="100" text-anchor="middle">yes</text><rect class="sel" x="808" y="86" width="104" height="28" rx="14"/><text class="fg s" x="860" y="100" text-anchor="middle">yes</text><text class="fg s t" x="40" y="144" text-anchor="start">hostname checked</text><rect class="ghost" x="208" y="130" width="104" height="28" rx="14"/><text class="muted s" x="260" y="144" text-anchor="middle"></text><rect class="ghost" x="328" y="130" width="104" height="28" rx="14"/><text class="muted s" x="380" y="144" text-anchor="middle"></text><rect class="ghost" x="448" y="130" width="104" height="28" rx="14"/><text class="muted s" x="500" y="144" text-anchor="middle"></text><rect class="ghost" x="568" y="130" width="104" height="28" rx="14"/><text class="muted s" x="620" y="144" text-anchor="middle"></text><rect class="ghost" x="688" y="130" width="104" height="28" rx="14"/><text class="muted s" x="740" y="144" text-anchor="middle"></text><rect class="sel" x="808" y="130" width="104" height="28" rx="14"/><text class="fg s" x="860" y="144" text-anchor="middle">yes</text></svg>
