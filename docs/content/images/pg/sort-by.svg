<svg id="pg-sort-by" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" role="img" aria-label="sort_by compares z_order ascending, then height descending; null sorts first and features that compare equal keep the order they were read in"><title>sort_by compares z_order ascending, then height descending; null sorts first and features that compare equal keep the order they were read in</title><style>#pg-sort-by{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#pg-sort-by .fg{fill:var(--md-default-fg-color,#000000de)}#pg-sort-by .muted{fill:var(--md-default-fg-color--light,#0000008a)}#pg-sort-by .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#pg-sort-by .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#pg-sort-by .head{fill:var(--md-default-fg-color--light,#0000008a)}#pg-sort-by text{dominant-baseline:central}#pg-sort-by .t{font-weight:600}#pg-sort-by .s{font-size:11px}#pg-sort-by .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#pg-sort-by .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#pg-sort-by .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pg-sort-by .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pg-sort-by .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#pg-sort-by .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#pg-sort-by .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#pg-sort-by .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#pg-sort-by .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#pg-sort-by .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#pg-sort-by .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#pg-sort-by .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg t" x="40" y="18" text-anchor="start">read order</text><text class="muted s" x="50" y="50" text-anchor="start">feature</text><text class="muted mono" x="140" y="50" text-anchor="start">z_order</text><text class="muted mono" x="210" y="50" text-anchor="start">height</text><rect class="box" x="40" y="58" width="240" height="24" rx="12"/><text class="fg mono t" x="50" y="70" text-anchor="start">f1</text><text class="fg mono" x="140" y="70" text-anchor="start">1</text><text class="fg mono" x="210" y="70" text-anchor="start">10</text><rect class="box" x="40" y="88" width="240" height="24" rx="12"/><text class="fg mono t" x="50" y="100" text-anchor="start">f2</text><text class="fg mono" x="140" y="100" text-anchor="start">0</text><text class="fg mono" x="210" y="100" text-anchor="start">30</text><rect class="box" x="40" y="118" width="240" height="24" rx="12"/><text class="fg mono t" x="50" y="130" text-anchor="start">f3</text><text class="fg mono" x="140" y="130" text-anchor="start">1</text><text class="fg mono" x="210" y="130" text-anchor="start">25</text><rect class="box" x="40" y="148" width="240" height="24" rx="12"/><text class="fg mono t" x="50" y="160" text-anchor="start">f4</text><text class="fg mono" x="140" y="160" text-anchor="start">0</text><text class="fg mono" x="210" y="160" text-anchor="start">30</text><rect class="box" x="40" y="178" width="240" height="24" rx="12"/><text class="fg mono t" x="50" y="190" text-anchor="start">f5</text><text class="fg mono" x="140" y="190" text-anchor="start">null</text><text class="fg mono" x="210" y="190" text-anchor="start">5</text><text class="fg t" x="520" y="18" text-anchor="start">sorted</text><text class="muted s"