<svg id="font-fallback" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="100%" role="img" aria-label="A composite font request takes each glyph from the first listed font that has it; a glyph no font has is left out of the range"><title>A composite font request takes each glyph from the first listed font that has it; a glyph no font has is left out of the range</title><style>#font-fallback{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#font-fallback .fg{fill:var(--md-default-fg-color,#000000de)}#font-fallback .muted{fill:var(--md-default-fg-color--light,#0000008a)}#font-fallback .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#font-fallback .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#font-fallback .head{fill:var(--md-default-fg-color--light,#0000008a)}#font-fallback text{dominant-baseline:central}#font-fallback .t{font-weight:600}#font-fallback .s{font-size:11px}#font-fallback .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#font-fallback .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#font-fallback .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#font-fallback .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#font-fallback .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#font-fallback .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#font-fallback .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#font-fallback .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#font-fallback .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#font-fallback .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#font-fallback .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#font-fallback .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg mono" x="40" y="18" text-anchor="start">GET /font/Font A,Font B/0-255</text><text class="muted mono" x="260" y="48" text-anchor="middle">U+0061</text><text class="muted mono" x="380" y="48" text-anchor="middle">U+0062</text><text class="muted mono" x="500" y="48" text-anchor="middle">U+0063</text><text class="muted mono" x="620" y="48" text-anchor="middle">U+0064</text><text class="muted mono" x="740" y="48" text-anchor="middle">U+0065</text><text class="fg t s" x="40" y="84" text-anchor="start">Font A</text><rect class="sel" x="208" y="68" width="104" height="32" rx="6"/><text class="fg t" x="260" y="84" text-anchor="middle">a</text><rect class="sel" x="328" y="68" width="104" height="32" rx="6"/><text class="fg t" x="380" y="84" text-anchor="middle">b</text><rect class="ghost" x="448" y="68" width="104" height="32" rx="6"/><rect class="sel" x="568" y="68" width="104" height="32" rx="6"/><text class="fg t" x="620" y="84" text-anchor="middle">d</text><rect class="ghost" x="688" y="68" width="104" height="32" rx="6"/><text class="fg t s" x="40" y="128" text-anchor="start">Font B</text><rect class="ghost" x="208" y="112" width="104" height="32" rx="6"/><rect class="box" x="328" y="112" width="104" height="32" rx="6"/><text class="fg t" x="380" y="128" text-anchor="middle">b</text><rect class="sel" x="448" y="112" width="104" height="32" rx="6"/><text class="fg t" x="500" y="128" text-anchor="middle">c</text><rect class="ghost" x="568" y="112" width="104" height="32" rx="6"/><rect class="ghost" x="688" y="112" width="104" height="32" rx="6"/><path class="line" d="M40 158 L800 158"/><text class="fg t s" x="40" y="188" text-anchor="start">glyph range</text><rect class="hi" x="208" y="172" width="104" height="32" rx="6"/><text class="fg t" x="260" y="188" text-anchor="middle">a</text><rect class="hi" x="328" y="172" width="104" height="32" rx="6"/><text class="fg t" x="380" y="188" text-anchor="middle">b</text><rect class="hi" x="448" y="172" width="104" height="32" rx="6"/><text class="fg t" x="500" y="188" text-anchor="middle">c</text><rect class="hi" x="568" y="172" width="104" height="32" rx="6"/><text class="fg t" x="620" y="188" text-anchor="middle">d</text><rect class="ghost" x="688" y="172" width="104" height="32" rx="6"/><text class="muted s" x="380" y="222" text-anchor="middle">first font wins</text><text class="muted s" x="740" y="222" text-anchor="middle">left out</text></svg>
