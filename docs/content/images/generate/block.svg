<svg id="gen-block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" role="img" aria-label="Prefetching with prefetch: 4: a cache miss renders the aligned 4 by 4 block holding the tile, from one query over the block and its buffer, and caches all 16 tiles"><title>Prefetching with prefetch: 4: a cache miss renders the aligned 4 by 4 block holding the tile, from one query over the block and its buffer, and caches all 16 tiles</title><style>#gen-block{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-block .fg{fill:var(--md-default-fg-color,#000000de)}#gen-block .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-block .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-block .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-block .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-block text{dominant-baseline:central}#gen-block .t{font-weight:600}#gen-block .s{font-size:11px}#gen-block .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-block .motion{display:none}}#gen-block .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-block .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-block .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-block .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-block .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-block .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-block .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-block .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-block .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-block .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-block .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-block .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-block .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-block .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-block .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-block .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-block .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-block .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}</style><rect class="b-sort" x="150" y="110" width="80" height="80" rx="0"/><path class="line" d="M70 30 V270"/><path class="line" d="M70 30 H310"/><path class="line" d="M90 30 V270"/><path class="line" d="M70 50 H310"/><path class="line" d="M110 30 V270"/><path class="line" d="M70 70 H310"/><path class="line" d="M130 30 V270"/><path class="line" d="M70 90 H310"/><path class="line" d="M150 30 V270"/><path class="line" d="M70 110 H310"/><path class="line" d="M170 30 V270"/><path class="line" d="M70 130 H310"/><path class="line" d="M190 30 V270"/><path class="line" d="M70 150 H310"/><path class="line" d="M210 30 V270"/><path class="line" d="M70 170 H310"/><path class="line" d="M230 30 V270"/><path class="line" d="M70 190 H310"/><path class="line" d="M250 30 V270"/><path class="line" d="M70 210 H310"/><path class="line" d="M270 30 V270"/><path class="line" d="M70 230 H310"/><path class="line" d="M290 30 V270"/><path class="line" d="M70 250 H310"/><path class="line" d="M310 30 V270"/><path class="line" d="M70 270 H310"/><path class="k-sort" fill="none" stroke-width="1.5" d="M70 30 V270"/><path class="k-sort" fill="none" stroke-width="1.5" d="M70 30 H310"/><path class="k-sort" fill="none" stroke-width="1.5" d="M150 30 V270"/><path class="k-sort" fill="none" stroke-width="1.5" d="M70 110 H310"/><path class="k-sort" fill="none" stroke-width="1.5" d="M230 30 V270"/><path class="k-sort" fill="none" stroke-width="1.5" d="M70 190 H310"/><path class="k-sort" fill="none" stroke-width="1.5" d="M310 30 V270"/><path class="k-sort" fill="none" stroke-width="1.5" d="M70 270 H310"/><rect class="b-alert" x="173" y="133" width="14" height="14" rx="2"/><rect class="line" x="144" y="104" width="92" height="92" rx="2" stroke-dasharray="3 3"/><text class="muted s" x="190.0" y="288" text-anchor="middle">one zoom, blocks aligned to multiples of 4</text><path class="line" d="M187 140.0 H340 L370 140.0"/><text class="fg t s" x="380" y="133.0" text-anchor="start">requested tile</text><text class="muted s" x="380" y="149.0" text-anchor="start">a cache miss</text><path class="line" d="M236 104 H340 L370 90"/><text class="fg t s" x="380" y="83" text-anchor="start">read area</text><text class="muted s" x="380" y="99" text-anchor="start">the block + the largest buffer, one query</text><path class="line" d="M230 184 H340 L370 204"/><text class="fg t s" x="380" y="197" text-anchor="start">block</text><text class="muted s" x="380" y="213" text-anchor="start">prefetch: 4, so 4×4 tiles, rendered at once</text><text class="fg t s" x="720" y="100" text-anchor="start">cached</text><text class="muted s" x="720" y="118" text-anchor="start">all 16 tiles, empty ones too,</text><text class="muted s" x="720" y="134" text-anchor="start">under the request's cache key</text><text class="fg t s" x="720" y="170" text-anchor="start">later requests</text><text class="muted s" x="720" y="188" text-anchor="start">any tile of the block is a cache hit</text><text class="fg t s" x="720" y="224" text-anchor="start">no prefetch</text><text class="muted s" x="720" y="242" text-anchor="start">without a tile cache, or outside</text><text class="muted s" x="720" y="258" text-anchor="start">its zooms: one tile at a time</text></svg>
