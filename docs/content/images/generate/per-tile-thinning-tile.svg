<svg id="gen-pt-tile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" role="img" aria-label="thinning with method tile keeps the first feature of each key in the tile and its buffer, so the right tile keeps 1, which only reaches into its buffer, and drops 2"><title>thinning with method tile keeps the first feature of each key in the tile and its buffer, so the right tile keeps 1, which only reaches into its buffer, and drops 2</title><style>#gen-pt-tile{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-tile .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-tile .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-tile .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-tile .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile text{dominant-baseline:central}#gen-pt-tile .t{font-weight:600}#gen-pt-tile .s{font-size:11px}#gen-pt-tile .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-tile .motion{display:none}}#gen-pt-tile .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-tile .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-tile .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .pre{white-space:pre}#gen-pt-tile .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-tile .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-tile .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-tile .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .unseen{opacity:.3}#gen-pt-tile .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-tile .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-tile .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-tile .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-tile .pgo{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.4;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-tile .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-tile .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-tile .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">thinning:</text><text class="mono fg pre" x="40" y="45" text-anchor="start">  method: tile</text><text class="mono fg pre" x="40" y="60" text-anchor="start">  keys: [name]</text><path class="ln" d="M260 30 H280"/><text class="muted s" x="288" y="30" text-anchor="start">kept</text><path class="lnd" d="M340 30 H360"/><text class="muted s" x="368" y="30" text-anchor="start">dropped</text><text class="muted s" x="441" y="30" text-anchor="start">1, 2: draw order</text><rect class="win" x="40" y="84" width="152" height="152"/><rect class="tile" x="56" y="100" width="120" height="120"/><rect class="other" x="176" y="100" width="120" height="120"/><path class="lnf unseen" d="M76 140 L170 150"/><clipPath id="gen-pt-tile-c1"><rect x="40" y="84" width="152" height="152"/></clipPath><path class="ln" d="M76 140 L170 150" clip-path="url(#gen-pt-tile-c1)"/><text class="fg s" x="80" y="128" text-anchor="start">1 Elm</text><path class="lnf unseen" d="M201 185 L281 195"/><clipPath id="gen-pt-tile-c2"><rect x="40" y="84" width="152" height="152"/></clipPath><path class="lnd" d="M201 185 L281 195" clip-path="url(#gen-pt-tile-c2)"/><text class="muted s unseen" x="206" y="172" text-anchor="start">2 Elm</text><rect class="edge" x="56" y="100" width="120" height="120"/><text class="fg t s" x="116" y="252" text-anchor="middle">left tile</text><rect class="win" x="490" y="84" width="152" height="152"/><rect class="tile" x="506" y="100" width="120" height="120"/><rect class="other" x="386" y="100" width="120" height="120"/><path class="lnf unseen" d="M406 140 L500 150"/><clipPath id="gen-pt-tile-c3"><rect x="490" y="84" width="152" height="152"/></clipPath><path class="ln" d="M406 140 L500 150" clip-path="url(#gen-pt-tile-c3)"/><text class="fg s" x="410" y="128" text-anchor="start">1 Elm</text><path class="lnf unseen" d="M531 185 L611 195"/><clipPath id="gen-pt-tile-c4"><rect x="490" y="84" width="152" height="152"/></clipPath><path class="lnd" d="M531 185 L611 195" clip-path="url(#gen-pt-tile-c4)"/><text class="muted s" x="536" y="172" text-anchor="start">2 Elm</text><rect class="edge" x="506" y="100" width="120" height="120"/><text class="fg t s" x="566" y="252" text-anchor="middle">right tile</text></svg>
