<svg id="gen-pt-tile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="100%" role="img" aria-label="thinning with method tile keeps the first feature of each key in each tile, and that can be a feature that only reaches into the buffer"><title>thinning with method tile keeps the first feature of each key in each tile, and that can be a feature that only reaches into the buffer</title><style>#gen-pt-tile{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-tile .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-tile .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-tile .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-tile .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile text{dominant-baseline:central}#gen-pt-tile .t{font-weight:600}#gen-pt-tile .s{font-size:11px}#gen-pt-tile .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-tile .motion{display:none}}#gen-pt-tile .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-tile .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-tile .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-tile .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-tile .pre{white-space:pre}#gen-pt-tile .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-tile .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-tile .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-tile .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-tile .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-tile .unseen{opacity:.3}#gen-pt-tile .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-tile .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-tile .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-tile .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-tile .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-tile .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-tile .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-tile .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-tile .gap{fill:none;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:2}#gen-pt-tile .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">thinning:</text><text class="mono fg pre" x="40" y="45" text-anchor="start">  method: tile</text><text class="mono fg pre" x="40" y="60" text-anchor="start">  keys: [name]</text><circle class="keep" cx="265" cy="30" r="5"/><text class="muted s" x="276" y="30" text-anchor="start">kept</text><circle class="drop" cx="325" cy="30" r="5"/><text class="muted s" x="336" y="30" text-anchor="start">dropped</text><circle class="drop unseen" cx="405" cy="30" r="5"/><text class="muted s" x="416" y="30" text-anchor="start">outside the tile and its buffer</text><text class="muted s" x="260" y="50" text-anchor="start">1, 2, 3: draw order, from sort_by</text><rect class="win" x="40" y="104" width="152" height="152"/><rect class="tile" x="56" y="120" width="120" height="120"/><path class="lnf unseen" d="M66 150 L166 160"/><clipPath id="gen-pt-tile-c1"><rect x="40" y="104" width="152" height="152"/></clipPath><path class="ln" d="M66 150 L166 160" clip-path="url(#gen-pt-tile-c1)"/><text class="fg s" x="70" y="138" text-anchor="start">1 Elm</text><path class="lnf unseen" d="M116 170 L126 230"/><clipPath id="gen-pt-tile-c2"><rect x="40" y="104" width="152" height="152"/></clipPath><path class="ln" d="M116 170 L126 230" clip-path="url(#gen-pt-tile-c2)"/><text class="fg s" x="130" y="200" text-anchor="start">2 Oak</text><path class="lnf unseen" d="M66 215 L106 225"/><clipPath id="gen-pt-tile-c3"><rect x="40" y="104" width="152" height="152"/></clipPath><path class="lnd" d="M66 215 L106 225" clip-path="url(#gen-pt-tile-c3)"/><text class="muted s" x="66" y="202" text-anchor="start">3 Elm</text><rect class="edge" x="56" y="120" width="120" height="120"/><text class="fg t s" x="116" y="272" text-anchor="middle">one tile</text><text class="muted s" x="116" y="287" text-anchor="middle">keeps 1, 2</text><text class="muted s" x="116" y="302" text-anchor="middle">drops 3</text><rect class="win" x="270" y="104" width="152" height="152"/><rect class="tile" x="286" y="120" width="120" height="120"/><rect class="other" x="406" y="120" width="120" height="120"/><path class="lnf unseen" d="M306 160 L400 170"/><clipPath id="gen-pt-tile-c4"><rect x="270" y="104" width="152" height="152"/></clipPath><path class="ln" d="M306 160 L400 170" clip-path="url(#gen-pt-tile-c4)"/><text class="fg s" x="310" y="148" text-anchor="start">1 Elm</text><path class="lnf unseen" d="M431 205 L511 215"/><clipPath id="gen-pt-tile-c5"><rect x="270" y="104" width="152" height="152"/></clipPath><path class="lnd" d="M431 205 L511 215" clip-path="url(#gen-pt-tile-c5)"/><text class="muted s unseen" x="436" y="192" text-anchor="start">2 Elm</text><rect class="edge" x="286" y="120" width="120" height="120"/><text class="fg t s" x="346" y="272" text-anchor="middle">left tile</text><text class="muted s" x="346" y="287" text-anchor="middle">keeps 1</text><rect class="win" x="710" y="104" width="152" height="152"/><rect class="tile" x="726" y="120" width="120" height="120"/><rect class="other" x="606" y="120" width="120" height="120"/><path class="lnf unseen" d="M626 160 L720 170"/><clipPath id="gen-pt-tile-c6"><rect x="710" y="104" width="152" height="152"/></clipPath><path class="ln" d="M626 160 L720 170" clip-path="url(#gen-pt-tile-c6)"/><text class="fg s" x="630" y="148" text-anchor="start">1 Elm</text><path class="lnf unseen" d="M751 205 L831 215"/><clipPath id="gen-pt-tile-c7"><rect x="710" y="104" width="152" height="152"/></clipPath><path class="lnd" d="M751 205 L831 215" clip-path="url(#gen-pt-tile-c7)"/><text class="muted s" x="756" y="192" text-anchor="start">2 Elm</text><rect class="edge" x="726" y="120" width="120" height="120"/><text class="fg t s" x="786" y="272" text-anchor="middle">right tile</text><text class="muted s" x="786" y="287" text-anchor="middle">keeps 1</text><text class="muted s" x="786" y="302" text-anchor="middle">drops 2</text><text class="f-alert s" x="786" y="317" text-anchor="middle">1 is only in its buffer</text><text class="f-alert s" x="786" y="332" text-anchor="middle">no Elm inside the tile</text></svg>
