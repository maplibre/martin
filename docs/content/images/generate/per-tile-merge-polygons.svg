<svg id="gen-pt-polygons" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" role="img" aria-label="merge_polygons unions a group's polygons in each tile: 1 and 2 touch, 3 is within distance, the hole in 1 is below min_hole_area and 4 below min_area; min_area counts only the part in the tile and its buffer, so the lower polygon is dropped from the right tile"><title>merge_polygons unions a group's polygons in each tile: 1 and 2 touch, 3 is within distance, the hole in 1 is below min_hole_area and 4 below min_area; min_area counts only the part in the tile and its buffer, so the lower polygon is dropped from the right tile</title><style>#gen-pt-polygons{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-polygons .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-polygons .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-polygons .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-polygons .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-polygons .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-polygons text{dominant-baseline:central}#gen-pt-polygons .t{font-weight:600}#gen-pt-polygons .s{font-size:11px}#gen-pt-polygons .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-polygons .motion{display:none}}#gen-pt-polygons .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-polygons .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-polygons .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-polygons .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-polygons .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-polygons .k-render{stroke:var(-