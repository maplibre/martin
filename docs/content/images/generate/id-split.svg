<svg id="gen-id-split" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" width="100%" role="img" aria-label="A view read as one scan, split into partitions by id remainder, and ordered by sort_by"><title>A view read as one scan, split into partitions by id remainder, and ordered by sort_by</title><style>#gen-id-split{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-id-split .fg{fill:var(--md-default-fg-color,#000000de)}#gen-id-split .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-id-split .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-id-split .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-id-split .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-id-split text{dominant-baseline:central}#gen-id-split .t{font-weight:600}#gen-id-split .s{font-size:11px}#gen-id-split .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-id-split .motion{display:none}}#gen-id-split .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-id-split .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-id-split .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-id-split .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-id-split .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-id-split .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-id-split .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-id-split .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-id-split .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-id-split .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-id-split .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-id-split .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-id-split .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-id-split .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-id-split .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-id-split .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-id-split .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-id-split .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg t" x="40" y="40" text-anchor="start">one scan</text><rect class="b-read" x="300.0" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="320.0" y="40" text-anchor="middle">2</text><rect class="b-read" x="358.3" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="378.3" y="40" text-anchor="middle">1</text><rect class="b-read" x="416.6" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="436.6" y="40" text-anchor="middle">3</text><rect class="b-read" x="474.9" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="494.9" y="40" text-anchor="middle">32</text><rect class="b-read" x="533.2" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="553.2" y="40" text-anchor="middle">33</text><rect class="b-read" x="591.5" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="611.5" y="40" text-anchor="middle">34</text><rect class="b-read" x="649.8" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="669.8" y="40" text-anchor="middle">35</text><rect class="b-read" x="708.1" y="22" width="40" height="36" rx="4"/><text class="fg mono" x="728.1" y="40" text-anchor="middle">64</text><text class="fg t" x="40" y="124" text-anchor="start">abs(id % 32)</text><rect class="line" x="294" y="100" width="100" height="48" rx="4"