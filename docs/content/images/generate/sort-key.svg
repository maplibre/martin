<svg id="gen-sort-key" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" role="img" aria-label="The 16-byte sort key: tile id and layer in the first word, partition and row in the second"><title>The 16-byte sort key: tile id and layer in the first word, partition and row in the second</title><style>#gen-sort-key{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-sort-key .fg{fill:var(--md-default-fg-color,#000000de)}#gen-sort-key .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-sort-key .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-sort-key .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-sort-key .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-sort-key text{dominant-baseline:central}#gen-sort-key .t{font-weight:600}#gen-sort-key .s{font-size:11px}#gen-sort-key .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-sort-key .motion{display:none}}#gen-sort-key .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-sort-key .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-sort-key .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-sort-key .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-sort-key .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-sort-key .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-sort-key .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-sort-key .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-sort-key .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-sort-key .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-sort-key .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-sort-key .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-sort-key .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-sort-key .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-sort-key .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-sort-key .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-sort-key .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-sort-key .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}</style><rect class="b-sort" x="40.0" y="40" width="385.0" height="44" rx="4"/><text class="fg t" x="232.5" y="55" text-anchor="middle">tile id</text><text class="muted s" x="232.5" y="71" text-anchor="middle">56 bits, position in the archive's tile order</text><rect class="b-render" x="425.0" y="40" width="55.0" height="44" rx="4"/><text class="fg t" x="452.5" y="55" text-anchor="middle">layer</text><text class="muted s" x="452.5" y="71" text-anchor="middle">8 bits</text><rect class="b-read" x="480.0" y="40" width="165.0" height="44" rx="4"/><text class="fg t" x="562.5" y="55" text-anchor="middle">partition</text><text class="muted s" x="562.5" y="71" text-anchor="middle">24 bits</text><rect class="b-read" x="645.0" y="40" width="275.0" height="44" rx="4"/><text class="fg t" x="782.5" y="55" text-anchor="middle">row</text><text class="muted s" x="782.5" y="71" text-anchor="middle">40 bits, row within the partition</text><path class="line" d="M480.0 34 V90" stroke-dasharray="3 3"/><text class="fg t s" x="40" y="118" text-anchor="start">1. sorted by tile id</text><text class="muted s" x="190" y="118" text-anchor="start">the pieces of one tile are adjacent, in the archive's tile order</text><text class="fg t s" x="40" y="140" text-anchor="start">2. sorted by layer</text><text class="muted s" x="190" y="140" text-anchor="start">inside a tile, layers come in their configured order</text><text class="fg t s" x="40" y="162" text-anchor="start">3. sorted by Seq</text><text class="muted s" x="190" y="162" text-anchor="start">inside a layer, features keep source order, whatever the number of threads</text></svg>
