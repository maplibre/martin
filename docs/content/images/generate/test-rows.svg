<svg id="gen-test-rows" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" role="img" aria-label="The row of a path: the row of the spec's case if it still takes the path, else a row the database selects, else the first row of a sweep"><title>The row of a path: the row of the spec's case if it still takes the path, else a row the database selects, else the first row of a sweep</title><style>#gen-test-rows{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-test-rows .fg{fill:var(--md-default-fg-color,#000000de)}#gen-test-rows .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-test-rows .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-test-rows .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-test-rows .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-test-rows text{dominant-baseline:central}#gen-test-rows .t{font-weight:600}#gen-test-rows .s{font-size:11px}#gen-test-rows .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-test-rows .motion{display:none}}#gen-test-rows .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-test-rows .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-test-rows .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-test-rows .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-test-rows .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-test-rows .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-test-rows .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-test-rows .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-test-rows .k-sort{stroke:var(--md-primary-fg-colo