<svg id="gen-serve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" role="img" aria-label="Serving a tile: one query reads the features around its block, and one thread renders, sorts, groups and encodes the block's tiles in memory"><title>Serving a tile: one query reads the features around its block, and one thread renders, sorts, groups and encodes the block's tiles in memory</title><style>#gen-serve{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-serve .fg{fill:var(--md-default-fg-color,#000000de)}#gen-serve .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-serve .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-serve .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-serve .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-serve text{dominant-baseline:central}#gen-serve .t{font-weight:600}#gen-serve .s{font-size:11px}#gen-serve .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-serve .motion{display:none}}#gen-serve .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-serve .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-serve .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-serve .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-serve .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-serve .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-serve .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-serve .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-serve .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-serve .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-serve .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-serve .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-serve .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-serve .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-serve .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-serve .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-serve .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-serve .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}</style><rect class="b-read" x="30" y="130" width="130" height="80" rx="6"/><text class="fg t" x="95.0" y="154.0" text-anchor="middle">tile request</text><text class="muted s" x="95.0" y="170.0" text-anchor="middle">z / x / y</text><text class="muted s" x="95.0" y="186.0" text-anchor="middle">on a cache miss</text><rect class="b-read" x="184" y="130" width="130" height="80" rx="6"/><text class="fg t" x="249.0" y="154.0" text-anchor="middle">feature query</text><text class="muted s" x="249.0" y="170.0" text-anchor="middle">block + largest buffer</text><text class="muted s" x="249.0" y="186.0" text-anchor="middle">in PostgreSQL's order</text><path class="arrow" d="M160 170.0 L184 170.0"/><path class="head" d="M184.0 170.0 L176.0 166.0 L176.0 174.0 Z"/><rect class="b-render" x="338" y="130" width="130" height="80" rx="6"/><text class="fg t" x="403.0" y="154.0" text-anchor="middle">render</text><text class="muted s" x="403.0" y="170.0" text-anchor="middle">only the block's zoom</text><text class="muted s" x="403.0" y="186.0" text-anchor="middle">only its tiles</text><path class="arrow" d="M314 170.0 L338 170.0"/><path class="head" d="M338.0 170.0 L330.0 166.0 L330.0 174.0 Z"/><rect class="b-sort" x="492" y="130" width="130" height="80" rx="6"/><text class="fg t" x="557.0" y="154.0" text-anchor="middle">sort buffer</text><text class="muted s" x="557.0" y="170.0" text-anchor="middle">in memory</text><text class="muted s" x="557.0" y="186.0" text-anchor="middle">never spilled</text><path class="arrow" d="M468 170.0 L492 170.0"/><path class="head" d="M492.0 170.0 L484.0 166.0 L484.0 174.0 Z"/><rect class="b-sort" x="646" y="130" width="130" height="80" rx="6"/><text class="fg t" x="711.0" y="154.0" text-anchor="middle">group</text><text class="muted s" x="711.0" y="170.0" text-anchor="middle">by tile</text><text class="muted s" x="711.0" y="186.0" text-anchor="middle">expand fill ranges</text><path class="arrow" d="M622 170.0 L646 170.0"/><path class="head" d="M646.0 170.0 L638.0 166.0 L638.0 174.0 Z"/><rect class="b-encode" x="800" y="130" width="130" height="80" rx="6"/><text class="fg t" x="865.0" y="154.0" text-anchor="middle">encode</text><text class="muted s" x="865.0" y="170.0" text-anchor="middle">uncompressed MVT</text><text class="muted s" x="865.0" y="186.0" text-anchor="middle">empty if no features</text><path class="arrow" d="M776 170.0 L800 170.0"/><path class="head" d="M800.0 170.0 L792.0 166.0 L792.0 174.0 Z"/><path class="b-read" d="M209.0 26 a40.0 8 0 0 0 80 0 v34 a40.0 8 0 0 1 -80 0 Z"/><path class="b-read" d="M209.0 26 a40.0 8 0 0 1 80 0 a40.0 8 0 0 1 -80 0"/><text class="fg s" x="249.0" y="80" text-anchor="middle"></text><text class="fg s" x="249.0" y="82" text-anchor="middle">PostgreSQL</text><path class="arrow" d="M249.0 96 L249.0 130"/><path class="head" d="M249.0 130.0 L253.0 122.0 L245.0 122.0 Z"/><path class="line" d="M338 108 V100 H930 V108"/><text class="fg t s" x="634.0" y="70" text-anchor="middle">one blocking thread, in memory</text><text class="muted s" x="634.0" y="86" text-anchor="middle">phase 1 and phase 2 of bulk mode, for one block</text><text class="muted s" x="480" y="262" text-anchor="middle">the server then converts, compresses and caches each tile, as for any other source; without prefetch, the block is the tile</text></svg>
