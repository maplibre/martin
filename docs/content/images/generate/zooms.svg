<svg id="gen-zooms" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" role="img" aria-label="Zoom ranges narrow from the command line to the table, the layer, each feature and each attribute"><title>Zoom ranges narrow from the command line to the table, the layer, each feature and each attribute</title><style>#gen-zooms{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-zooms .fg{fill:var(--md-default-fg-color,#000000de)}#gen-zooms .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-zooms .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-zooms .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-zooms .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-zooms text{dominant-baseline:central}#gen-zooms .t{font-weight:600}#gen-zooms .s{font-size:11px}#gen-zooms .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-zooms .motion{display:none}}#gen-zooms .b-read{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-zooms .f-read{fill:var(--md-accent-fg-color,#7c4dff)}#gen-zooms .k-read{stroke:var(--md-primary-fg-color,#673ab7)}#gen-zooms .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-zooms .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-zooms .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-zooms .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-zooms .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-zooms .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-zooms .b-encode{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-zooms .f-encode{fill:va