<svg id="gen-pt-lines" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" role="img" aria-label="merge_lines joins lines with equal attributes where exactly two ends meet, in each tile on its own: each tile's line ends at its buffer, min_length counts only the length in the tile and its buffer, and each tile simplifies its own line"><title>merge_lines joins lines with equal attributes where exactly two ends meet, in each tile on its own: each tile's line ends at its buffer, min_length counts only the length in the tile and its buffer, and each tile simplifies its own line</title><style>#gen-pt-lines{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-lines .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-lines .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-lines .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-lines .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines text{dominant-baseline:central}#gen-pt-lines .t{font-weight:600}#gen-pt-lines .s{font-size:11px}#gen-pt-lines .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-lines .motion{display:none}}#gen-pt-lines .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-lines .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-lines .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .pre{white-space:pre}#gen-pt-lines .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-lines .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-lines .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-lines .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .unseen{opacity:.3}#gen-pt-lines .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-lines .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-lines .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-lines .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-lines .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-lines .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-lines .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-lines .gap{fill:none;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:2}#gen-pt-lines .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">merge_lines:</text><text class="mono fg pre" x="40" y="45" text-anchor="start">  min_length: 48</text><text class="mono fg pre" x="40" y="60" text-anchor="start">  tolerance: 24</text><text class="muted s" x="260" y="30" text-anchor="start">1 to 5: all kind=road</text><rect class="win" x="40" y="94" width="152" height="152"/><rect class="tile" x="56" y="110" width="120" height="120"/><clipPath id="gen-pt-lines-c1"><rect x="40" y="94" width="152" height="152"/></clipPath><path class="ln" d="M66 140 L106 150" clip-path="url(#gen-pt-lines-c1)"/><circle class="end" cx="66" cy="140" r="3"/><circle class="end" cx="106" cy="150" r="3"/><text class="fg s" x="84" y="132" text-anchor="middle">1</text><clipPath id="gen-pt-lines-c2"><rect x="40" y="94" width="152" height="152"/></clipPath><path class="ln" d="M106 150 L166 135" clip-path="url(#gen-pt-lines-c2)"/><circle class="end" cx="106" cy="150" r="3"/><circle class="end" cx="166" cy="135" r="3"/><text class="fg s" x="138" y="130" text-anchor="middle">2</text><clipPath id="gen-pt-lines-c3"><rect x="40" y="94" width="152" height="152"/></clipPath><path class="ln" d="M71 200 L116 190" clip-path="url(#gen-pt-lines-c3)"/><circle class="end" cx="71" cy="200" r="3"/><circle class="end" cx="116" cy="190" r="3"/><text class="fg s" x="91" y="182" text-anchor="middle">3</text><clipPath id="gen-pt-lines-c4"><rect x="40" y="94" width="152" height="152"/></clipPath><path class="ln" d="M116 190 L161 205" clip-path="url(#gen-pt-lines-c4)"/><circle class="end" cx="116" cy="190" r="3"/><circle class="end" cx="161" cy="205" r="3"/><text class="fg s" x="142" y="186" text-anchor="middle">4</text><clipPath id="gen-pt-lines-c5"><rect x="40" y="94" width="152" height="152"/></clipPath><path class="ln" d="M116 190 L121 225" clip-path="url(#gen-pt-lines-c5)"/><circle class="end" cx="116" cy="190" r="3"/><circle class="end" cx="121" cy="225" r="3"/><text class="fg s" x="128" y="216" text-anchor="middle">5</text><text class="fg t s" x="116" y="262" text-anchor="middle">before</text><rect class="win" x="215" y="94" width="152" height="152"/><rect class="tile" x="231" y="110" width="120" height="120"/><clipPath id="gen-pt-lines-c6"><rect x="215" y="94" width="152" height="152"/></clipPath><path class="ln" d="M241 140 L281 150 L341 135" clip-path="url(#gen-pt-lines-c6)"/><circle class="end" cx="241" cy="140" r="3"/><circle class="end" cx="341" cy="135" r="3"/><clipPath id="gen-pt-lines-c7"><rect x="215" y="94" width="152" height="152"/></clipPath><path class="ln" d="M246 200 L291 190" clip-path="url(#gen-pt-lines-c7)"/><circle class="end" cx="246" cy="200" r="3"/><circle class="end" cx="291" cy="190" r="3"/><text class="fg s" x="266" y="182" text-anchor="middle">3</text><clipPath id="gen-pt-lines-c8"><rect x="215" y="94" width="152" height="152"/></clipPath><path class="ln" d="M291 190 L336 205" clip-path="url(#gen-pt-lines-c8)"/><circle class="end" cx="291" cy="190" r="3"/><circle class="end" cx="336" cy="205" r="3"/><text class="fg s" x="317" y="186" text-anchor="middle">4</text><clipPath id="gen-pt-lines-c9"><rect x="215" y="94" width="152" height="152"/></clipPath><path class="ln" d="M291 190 L296 225" clip-path="url(#gen-pt-lines-c9)"/><circle class="end" cx="291" cy="190" r="3"/><circle class="end" cx="296" cy="225" r="3"/><text class="fg s" x="303" y="216" text-anchor="middle">5</text><text class="fg s" x="286" y="130" text-anchor="middle">1+2</text><text class="fg t s" x="291" y="262" text-anchor="middle">after</text><text class="muted s" x="40" y="286" text-anchor="start">1, 2: two ends meet, joined</text><text class="muted s" x="40" y="301" text-anchor="start">3, 4, 5: three ends meet, not joined</text><text class="fg t s" x="420" y="80" text-anchor="start">each tile simplifies its own line</text><rect class="win" x="420" y="94" width="272" height="152"/><rect class="tile" x="436" y="110" width="240" height="120"/><path class="edge" d="M556 110 V230"/><path class="lnf" d="M420 170.367 L463 173 L534 161 L552 158 L558 176 L562 183 L684 157 L692 164.429"/><path class="ln" d="M420 170.367 L552 158 L572 180.869"/><path class="lnd" d="M540 160 L562 183 L692 164.429"/><circle class="gap" cx="556" cy="162.574" r="4"/><circle class="gap" cx="556" cy="176.727" r="4"/><text class="muted s" x="556" y="262" text-anchor="middle">grey: the line before tolerance</text><text class="muted s" x="556" y="277" text-anchor="middle">solid: left tile, dashed: right tile</text><text class="f-alert s" x="556" y="292" text-anchor="middle">they cross the edge at different points</text><text class="fg t s" x="40" y="350" text-anchor="start">each tile joins what it sees</text><rect class="win" x="40" y="364" width="152" height="152"/><rect class="tile" x="56" y="380" width="120" height="120"/><rect class="other" x="176" y="380" width="120" height="120"/><path class="lnf unseen" d="M20 420 L116 410 L226 425 L33