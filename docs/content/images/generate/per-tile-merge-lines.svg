<svg id="gen-pt-lines" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" role="img" aria-label="merge_lines joins lines where exactly two ends meet; each tile joins, simplifies and measures only what it holds in the tile and its buffer, so the tiles' lines cross the edge at different points and the lower line is dropped from the right tile"><title>merge_lines joins lines where exactly two ends meet; each tile joins, simplifies and measures only what it holds in the tile and its buffer, so the tiles' lines cross the edge at different points and the lower line is dropped from the right tile</title><style>#gen-pt-lines{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-lines .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-lines .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-lines .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-lines .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines text{dominant-baseline:central}#gen-pt-lines .t{font-weight:600}#gen-pt-lines .s{font-size:11px}#gen-pt-lines .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-lines .motion{display:none}}#gen-pt-lines .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-lines .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-lines .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-lines .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-lines .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-lines .pre{white-space:pre}#gen-pt-lines .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-lines .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-lines .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-lines .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-lines .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-lines .unseen{opacity:.3}#gen-pt-lines .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-lines .lnd{stroke:var(--md