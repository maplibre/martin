<svg id="gen-pt-limit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="limit keeps the first count features of the layer in each tile, those in the buffer included, so a feature near the edge can be kept in its own tile and dropped from the buffer of the next"><title>limit keeps the first count features of the layer in each tile, those in the buffer included, so a feature near the edge can be kept in its own tile and dropped from the buffer of the next</title><style>#gen-pt-limit{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-limit .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-limit .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-limit .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-limit .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit text{dominant-baseline:central}#gen-pt-limit .t{font-weight:600}#gen-pt-limit .s{font-size:11px}#gen-pt-limit .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-limit .motion{display:none}}#gen-pt-limit .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-limit .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-limit .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .pre{white-space:pre}#gen-pt-limit .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-limit .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-limit .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-limit .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .unseen{opacity:.3}#gen-pt-limit .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-limit .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-limit .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-limit .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-limit .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-limit .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-limit .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-limit .gap{fill:none;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:2}#gen-pt-limit .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">limit: 3</text><circle class="keep" cx="205" cy="30" r="5"/><text class="muted s" x="216" y="30" text-anchor="start">kept</text><circle class="drop" cx="265" cy="30" r="5"/><text class="muted s" x="276" y="30" text-anchor="start">dropped</text><circle class="drop unseen" cx="345" cy="30" r="5"/><text class="muted s" x="356" y="30" text-anchor="start">outside the tile and its buffer</text><text class="muted s" x="200" y="50" text-anchor="start">1, 2, 3: draw order, from sort_by</text><rect class="win" x="40" y="88" width="164" height="164"/><rect class="tile" x="62" y="110" width="120" height="120"/><circle class="keep" cx="92" cy="150" r="5"/><text class="fg s" x="101" y="150" text-anchor="start">1</text><circle class="keep" cx="194" cy="180" r="5"/><text class="fg s" x="203" y="180" text-anchor="start">2</text><circle class="keep" cx="142" cy="205" r="5"/><text class="fg s" x="151" y="205" text-anchor="start">3</text><circle class="drop" cx="147" cy="135" r="5"/><text class="muted s" x="156" y="135" text-anchor="start">4</text><circle class="drop" cx="102" cy="210" r="5"/><text class="muted s" x="111" y="210" text-anchor="start">5</text><text class="fg t s" x="122" y="268" text-anchor="middle">one tile</text><text class="muted s" x="122" y="283" text-anchor="middle">keeps 1, 2, 3</text><text class="muted s" x="122" y="298" text-anchor="middle">drops 4, 5</text><text class="f-alert s" x="122" y="313" text-anchor="middle">2 is in the buffer</text><rect class="win" x="270" y="88" width="164" height="164"/><rect class="tile" x="292" y="110" width="120" height="120"/><rect class="other" x="412" y="110" width="120" height="120"/><circle class="drop unseen" cx="462" cy="140" r="5"/><text class="muted s unseen" x="471" y="140" text-anchor="start">1</text><circle class="drop unseen" cx="497" cy="185" r="5"/><text class="muted s unseen" x="506" y="185" text-anchor="start">2</text><circle class="drop unseen" cx="452" cy="210" r="5"/><text class="muted s unseen" x="461" y="210" text-anchor="start">3</text><circle class="keep" cx="402" cy="170" r="5"/><text class="fg s" x="411" y="170" text-anchor="start">4</text><circle class="keep" cx="327" cy="145" r="5"/><text class="fg s" x="336" y="145" text-anchor="start">5</text><circle class="keep" cx="352" cy="205" r="5"/><text class="fg s" x="361" y="205" text-anchor="start">6</text><text class="fg t s" x="352" y="268" text-anchor="middle">left tile</text><text class="muted s" x="352" y="283" text-anchor="middle">keeps 4, 5, 6</text><text class="f-alert s" x="352" y="298" text-anchor="middle">4 kept</text><rect class="win" x="710" y="88" width="164" height="164"/><rect class="tile" x="732" y="110" width="120" height="120"/><rect class="other" x="612" y="110" width="120" height="120"/><circle class="keep" cx="782" cy="140" r="5"/><text class="fg s" x="791" y="140" text-anchor="start">1</text><circle class="keep" cx="817" cy="185" r="5"/><text class="fg s" x="826" y="185" text-anchor="start">2</text><circle class="keep" cx="772" cy="210" r="5"/><text class="fg s" x="781" y="210" text-anchor="start">3</text><circle class="drop" cx="722" cy="170" r="5"/><text class="muted s" x="731" y="170" text-anchor="start">4</text><circle class="drop unseen" cx="647" cy="145" r="5"/><text class="muted s unseen" x="656" y="145" text-anchor="start">5</text><circle class="drop unseen" cx="672" cy="205" r="5"/><text class="muted s unseen" x="681" y="205" text-anchor="start">6</text><text class="fg t s" x="792" y="268" text-anchor="middle">right tile</text><text class="muted s" x="792" y="283" text-anchor="middle">keeps 1, 2, 3</text><text class="muted s" x="792" y="298" text-anchor="middle">drops 4</text><text class="f-alert s" x="792" y="313" text-anchor="middle">4 dropped from the buffer</text></svg>
