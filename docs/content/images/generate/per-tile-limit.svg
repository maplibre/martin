<svg id="gen-pt-limit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" role="img" aria-label="limit keeps the first count features in the tile and its buffer, so 1 in the right tile's buffer takes a place and 5, kept in the left tile, is dropped from the right"><title>limit keeps the first count features in the tile and its buffer, so 1 in the right tile's buffer takes a place and 5, kept in the left tile, is dropped from the right</title><style>#gen-pt-limit{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-limit .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-limit .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-limit .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-limit .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit text{dominant-baseline:central}#gen-pt-limit .t{font-weight:600}#gen-pt-limit .s{font-size:11px}#gen-pt-limit .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-limit .motion{display:none}}#gen-pt-limit .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-limit .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-limit .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-limit .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-limit .pre{white-space:pre}#gen-pt-limit .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-limit .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-limit .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-limit .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-limit .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .unseen{opacity:.3}#gen-pt-limit .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-limit .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-limit .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-limit .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-limit .pgo{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.4;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-limit .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-limit .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-limit .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-limit .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-limit .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">limit: 3</text><circle class="keep" cx="205" cy="30" r="5"/><text class="muted s" x="216" y="30" text-anchor="start">kept</text><circle class="drop" cx="273" cy="30" r="5"/><text class="muted s" x="284" y="30" text-anchor="start">dropped</text><text class="muted s" x="357" y="30" text-anchor="start">1, 2, 3: draw order</text><rect class="win" x="40" y="78" width="164" height="164"/><rect class="tile" x="62" y="100" width="120" height="120"/><rect class="other" x="182" y="100" width="120" height="120"/><circle class="keep" cx="172" cy="135" r="5"/><text class="fg s" x="163" y="135" text-anchor="end">1</text><circle class="drop unseen" cx="232" cy="130" r="5"/><text class="muted s unseen" x="241" y="130" text-anchor="start">2</text><circle class="drop unseen" cx="272" cy="170" r="5"/><text class="muted s unseen" x="281" y="170" text-anchor="start">3</text><circle class="drop unseen" cx="227" cy="200" r="5"/><text class="muted s unseen" x="236" y="200" 