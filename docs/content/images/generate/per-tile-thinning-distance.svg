<svg id="gen-pt-distance" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="100%" role="img" aria-label="thinning with method distance drops a feature within distance of an earlier kept one with the same key in the tile and its buffer, so with a buffer below distance both 1 and 2 are kept; a line counts at a different point in each tile"><title>thinning with method distance drops a feature within distance of an earlier kept one with the same key in the tile and its buffer, so with a buffer below distance both 1 and 2 are kept; a line counts at a different point in each tile</title><style>#gen-pt-distance{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-distance .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-distance .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-distance .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-distance .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-distance .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-distance text{dominant-baseline:central}#gen-pt-distance .t{font-weight:600}#gen-pt-distance .s{font-size:11px}#gen-pt-distance .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-distance .motion{display:none}}#gen-pt-distance .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-distance .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-distance .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-distance .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-distance .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-distance .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-distance .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-distance .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-distance .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-distance .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-distance .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-distance .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-distance .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-distance .pre{white-space:pre}#gen-pt-distance .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-distance .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-distance .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-distance .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-distance .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-distance .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-distance .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-distance .unseen{opacity:.3}#gen-pt-distance .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke