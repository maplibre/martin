<svg id="gen-pt-grid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" role="img" aria-label="thinning with method grid keeps the first limit points of each world-aligned square in each tile, the buffer included; a square across a tile edge is counted the same way in both tiles only when the buffer is at least size"><title>thinning with method grid keeps the first limit points of each world-aligned square in each tile, the buffer included; a square across a tile edge is counted the same way in both tiles only when the buffer is at least size</title><style>#gen-pt-grid{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-grid .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-grid .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-grid .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-grid .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-grid .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-grid text{dominant-baseline:central}#gen-pt-grid .t{font-weight:600}#gen-pt-grid .s{font-size:11px}#gen-pt-grid .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-grid .motion{display:none}}#gen-pt-grid .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-grid .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-grid .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-grid .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-grid .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-grid .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-grid .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-grid .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-grid .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-grid .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-grid .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-grid .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-grid .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-grid .pre{white-space:pre}#gen-pt-grid .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-grid .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-grid .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-grid .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-grid .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-grid .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-grid .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-grid .unseen{opacity:.3}#gen-pt-grid .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-grid .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-grid .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-grid .pg{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.25;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5;fill-rule:evenodd}#gen-pt-grid .pgd{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5;stroke-dasharray:4 3;fill-rule:evenodd}#gen-pt-grid .pgf{fill:var(--md-default-fg-color--lighter,#00000052);fill-opacity:.3;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;fill-rule:evenodd}#gen-pt-grid .end{fill:var(--md-default-bg-color,#fff);stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-grid .ring{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:3 3}#gen-pt-grid .gap{fill:none;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:2}#gen-pt-grid .rep{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="mono fg pre" x="40" y="30" text-anchor="start">thinning:</text><text class="mono fg pre" x="40" y="45" text-anchor="start">  method: grid</text><text class="mono fg pre" x="40" y="60" text-anchor="start">  size: 96</text><text class="mono fg pre" x="40" y="75" text-anchor="start">  limit: 1</text><circle class="keep" cx="265" cy="30" r="5"/><text class="muted s" x="276" y="30" text-anchor="start">kept</text><circle class="drop" cx="325" cy="30" r="5"/><text class="muted s" x="336" y="30" text-anchor="start">dropped</text><circle class="drop unseen" cx="405" cy="30" r="5"/><text class="muted s" x="416" y="30" text-anchor="start">outside the tile and its buffer</text><text class="muted s" x="260" y="50" text-anchor="start">1, 2, 3: draw order, from sort_by</text><text class="muted s" x="260" y="70" text-anchor="start">squares: aligned to the world, not to tiles</text><text class="fg t s" x="40" y="120" text-anchor="start">buffer below size</text><rect class="win" x="40" y="190" width="150" height="150"/>