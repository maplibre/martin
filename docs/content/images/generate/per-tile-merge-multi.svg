roke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-multi .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .pre{white-space:pre}#gen-pt-multi .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-multi .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-multi .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-multi .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .unseen{opacity:.3}#gen-pt-multi .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-multi .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-multi .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2