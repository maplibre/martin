<svg id="gen-pt-multi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" role="img" aria-label="merge_multi combines a group's points into one multi-point in each tile, keeping only the group_by attributes; c in the buffer is a part in both tiles"><title>merge_multi combines a group's points into one multi-point in each tile, keeping only the group_by attributes; c in the buffer is a part in both tiles</title><style>#gen-pt-multi{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#gen-pt-multi .fg{fill:var(--md-default-fg-color,#000000de)}#gen-pt-multi .muted{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-multi .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#gen-pt-multi .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#gen-pt-multi .head{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-multi text{dominant-baseline:central}#gen-pt-multi .t{font-weight:600}#gen-pt-multi .s{font-size:11px}#gen-pt-multi .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}@media (prefers-reduced-motion:reduce){#gen-pt-multi .motion{display:none}}#gen-pt-multi .b-read{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#gen-pt-multi .f-read{fill:var(--md-default-fg-color--light,#0000008a)}#gen-pt-multi .k-read{stroke:var(--md-default-fg-color--light,#0000008a)}#gen-pt-multi .b-render{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-render{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-render{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-sort{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-sort{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-sort{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-encode{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-encode{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-encode{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-write{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#gen-pt-multi .f-write{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-write{stroke:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .b-alert{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.1;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#gen-pt-multi .f-alert{fill:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .k-alert{stroke:var(--md-accent-fg-color,#7c4dff)}#gen-pt-multi .pre{white-space:pre}#gen-pt-multi .tile{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .edge{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .other{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1}#gen-pt-multi .win{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1;stroke-dasharray:4 3}#gen-pt-multi .sq{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1;stroke-dasharray:2 3}#gen-pt-multi .keep{fill:var(--md-primary-fg-color,#673ab7)}#gen-pt-multi .drop{fill:var(--md-default-bg-color,#fff);stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#gen-pt-multi .unseen{opacity:.3}#gen-pt-multi .ln{stroke:var(--md-primary-fg-color,#673ab7);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}#gen-pt-multi .lnd{stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:2;fill:none;stroke-dasharray:5 4}#gen-pt-multi .lnf{stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:2;fill:none;stroke-line