<svg id="ogc-walk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" width="100%" role="img" aria-label="A client starts at /ogc and follows links: data to /ogc/collections, tilesets-vector to the tilesets of world_cities, self to the WebMercatorQuad tileset, and item to the tile URL template"><title>A client starts at /ogc and follows links: data to /ogc/collections, tilesets-vector to the tilesets of world_cities, self to the WebMercatorQuad tileset, and item to the tile URL template</title><style>#ogc-walk{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#ogc-walk .fg{fill:var(--md-default-fg-color,#000000de)}#ogc-walk .muted{fill:var(--md-default-fg-color--light,#0000008a)}#ogc-walk .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#ogc-walk .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#ogc-walk .head{fill:var(--md-default-fg-color--light,#0000008a)}#ogc-walk text{dominant-baseline:central}#ogc-walk .t{font-weight:600}#ogc-walk .s{font-size:11px}#ogc-walk .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#ogc-walk .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#ogc-walk .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#ogc-walk .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#ogc-walk .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#ogc-walk .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#ogc-walk .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#ogc-walk .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#ogc-walk .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#ogc-walk .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#ogc-walk .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="hi" x="40" y="20" width="520" height="52" rx="4"/><text class="fg mono t" x="54" y="38" text-anchor="start">GET /ogc</text><text class="muted s" x="54" y="57" text-anchor="start">landing page</text><path class="arrow" d="M70 72 L70 114"/><path class="head" d="M70 114 L66 106 L74 106 Z"/><text class="muted mono" x="82" y="93.0" text-anchor="start">rel: data</text><rect class="hi" x="40" y="114" width="520" height="52" rx="4"/><text class="fg mono t" x="54" y="132" text-anchor="start">GET /ogc/collections</text><text class="muted s" x="54" y="151" text-anchor="start">one collection per source</text><path class="arrow" d="M70 166 L70 208"/><path class="head" d="M70 208 L66 200 L74 200 Z"/><text class="muted mono" x="82" y="187.0" text-anchor="start">rel: ...tilesets-vector</text><rect class="hi" x="40" y="208" width="520" height="52" rx="4"/><text class="fg mono t" x="54" y="226" text-anchor="start">GET /ogc/collections/world_cities/tiles</text><text class="muted s" x="54" y="245" text-anchor="start">world_cities has one tileset, on its own grid</text><path class="arrow" d="M70 260 L70 302"/><path class="head" d="M70 302 L66 294 L74 294 Z"/><text class="muted mono" x="82" y="281.0" text-anchor="start">rel: self</text><rect class="hi" x="40" y="302" width="520" height="52" rx="4"/><text class="fg mono t" x="54" y="320" text-anchor="start">GET /ogc/collections/world_cities/tiles/WebMercatorQuad</text><text class="muted s" x="54" y="339" text-anchor="start">zoom range, layers and the tile URL template</text><path class="arrow" d="M70 354 L70 396"/><path class="head" d="M70 396 L66 388 L74 388 Z"/><text class="muted mono" x="82" y="375.0" text-anchor="start">rel: item, fill in {tileMatrix}/{tileRow}/{tileCol}</text><rect class="sel" x="40" y="396" width="520" height="52" rx="4"/><text class="fg mono t" x="54" y="414" text-anchor="start">GET /ogc/collections/world_cities/tiles/WebMercatorQuad/2/1/3</text><text class="muted s" x="54" y="433" text-anchor="start">a tile</text><rect class="ghost" x="650" y="14" width="270" height="30" rx="4"/><text class="fg mono" x="662" y="29" text-anchor="start">/ogc/conformance</text><rect class="ghost" x="650" y="54" width="270" height="30" rx="4"/><text class="fg mono" x="662" y="69" text-anchor="start">/ogc/tileMatrixSets</text><path class="arrow" d="M560 46 L600 46 L600 29 L648 29"/><path class="head" d="M648 29 L640 25 L640 33 Z"/><path class="arrow" d="M600 46 L600 69 L648 69"/><path class="head" d="M648 69 L640 65 L640 73 Z"/><text class="muted s" x="785.0" y="102" text-anchor="middle">also linked from the landing page</text><rect class="ghost" x="650" y="313" width="270" height="30" rx="4"/><text class="fg mono" x="662" y="328" text-anchor="start">/ogc/tileMatrixSets/WebMercatorQuad</text><path class="arrow" d="M560 328 L648 328"/><path class="head" d="M648 328 L640 324 L640 332 Z"/><text class="muted s" x="785.0" y="360" text-anchor="middle">the grid definition</text></svg>
