<svg id="neighborhood" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" role="img" aria-label="Tiles are traced across a 3 by 3 neighborhood with an apron into each neighbor and only the center is encoded; x wraps to the far side at the antimeridian, while missing slots at the poles are clamped from the center"><title>Tiles are traced across a 3 by 3 neighborhood with an apron into each neighbor and only the center is encoded; x wraps to the far side at the antimeridian, while missing slots at the poles are clamped from the center</title><style>#neighborhood{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#neighborhood .fg{fill:var(--md-default-fg-color,#000000de)}#neighborhood .muted{fill:var(--md-default-fg-color--light,#0000008a)}#neighborhood .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#neighborhood .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#neighborhood .head{fill:var(--md-default-fg-color--light,#0000008a)}#neighborhood text{dominant-baseline:central}#neighborhood .t{font-weight:600}#neighborhood .s{font-size:11px}#neighborhood .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#neighborhood .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#neighborhood .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#neighborhood .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#neighborhood .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#neighborhood .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#neighborhood .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#neighborhood .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#neighborhood .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#neighborhood .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#neighborhood .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg t" x="145" y="14" text-anchor="middle">3×3 neighborhood</text><rect class="box" x="40" y="50" width="70" height="70" rx="0"/><rect class="box" x="110" y="50" width="70" height="70" rx="0"/><rect class="box" x="180" y="50" width="70" height="70" rx="0"/><rect class="box" x="40" y="120" width="70" height="70" rx="0"/><rect class="box" x="110" y="120" width="70" height="70" rx="0"/><rect class="box" x="180" y="120" width="70" height="70" rx="0"/><rect class="box" x="40" y="190" width="70" height="70" rx="0"/><rect class="box" x="110" y="190" width="70" height="70" rx="0"/><rect class="box" x="180" y="190" width="70" height="70" rx="0"/><rect class="apron" x="94" y="104" width="102" height="102" rx="0"/><rect class="sel" x="110" y="120" width="70" height="70" rx="0"/><text class="fg s t" x="145" y="155" text-anchor="middle">center</text><text class="muted s" x="145" y="282" text-anchor="middle">dashed: fetch_margin apron</text><text class="fg t" x="465" y="14" text-anchor="middle">antimeridian</text><rect class="box" x="360" y="50" width="70" height="70" rx="0"/><rect class="box" x="430" y="50" width="70" height="70" rx="0"/><rect class="box" x="500" y="50" width="70" height="70" rx="0"/><rect class="box" x="360" y="120" width="70" height="70" rx="0"/><rect class="box" x="430" y="120" width="70" height="70" rx="0"/><rect class="box" x="500" y="120" width="70" height="70" rx="0"/><rect class="box" x="360" y="190" width="70" height="70" rx="0"/><rect class="box" x="430" y="190" width="70" height="70" rx="0"/><rect class="box" x="500" y="190" width="70" height="70" rx="0"/><rect class="apron" x="414" y="104" width="102" height="102" rx="0"/><rect class="sel" x="430" y="120" width="70" height="70" rx="0"/><text class="fg s t" x="465" y="155" text-anchor="middle">x = 0</text><text class="muted s" x="395" y="40" text-anchor="middle">x = 2ᶻ−1</text><text class="muted s" x="465" y="40" text-anchor="middle">x = 0</text><text class="muted s" x="535" y="40" text-anchor="middle">x = 1</text><path class="accline" d="M430 50 L430 268" stroke-dasharray="6 4"/><text class="muted s" x="465" y="282" text-anchor="middle">x wraps</text><text class="fg t" x="785" y="14" text-anchor="middle">pole</text><rect class="ghost" x="680" y="50" width="70" height="70" rx="0"/><rect class="ghost" x="750" y="50" width="70" height="70" rx="0"/><rect class="ghost" x="820" y="50" width="70" height="70" rx="0"/><rect class="box" x="680" y="120" width="70" height="70" rx="0"/><rect class="box" x="750" y="120" width="70" height="70" rx="0"/><rect class="box" x="820" y="120" width="70" height="70" rx="0"/><rect class="box" x="680" y="190" width="70" height="70" rx="0"/><rect class="box" x="750" y="190" width="70" height="70" rx="0"/><rect class="box" x="820" y="190" width="70" height="70" rx="0"/><rect class="apron" x="734" y="104" width="102" height="102" rx="0"/><rect class="sel" x="750" y="120" width="70" height="70" rx="0"/><text class="fg s t" x="785" y="155" text-anchor="middle">y = 0</text><path class="accarrow" d="M715 116 L715 80"/><path class="acchead" d="M715 80 L719.0 88.0 L711.0 88.0 Z"/><text class="muted s" x="715" y="66" text-anchor="middle">no tile</text><path class="accarrow" d="M785 116 L785 80"/><path class="acchead" d="M785 80 L789.0 88.0 L781.0 88.0 Z"/><text class="muted s" x="785" y="66" text-anchor="middle">no tile</text><path class="accarrow" d="M855 116 L855 80"/><path class="acchead" d="M855 80 L859.0 88.0 L851.0 88.0 Z"/><text class="muted s" x="855" y="66" text-anchor="middle">no tile</text><text class="muted s" x="785" y="282" text-anchor="mid