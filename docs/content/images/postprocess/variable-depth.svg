idth="70" height="70" rx="0"/><rect class="box" x="430" y="190" width="70" height="70" rx="0"/><rect class="box" x="500" y="190" width="70" height="70" rx="0"/><rect class="apron" x="478.5" y="168.5" width="25.5" height="25.5" rx="0"/><rect class="sel" x="482.5" y="172.5" width="17.5" height="17.5" rx="0"/><text class="fg s t" x="465" y="140" text-anchor="middle">ancestor</text><text class="muted s" x="465" y="282" text-anchor="middle">solid: part under the z14 tile</text><text class="fg t" x="785" y="14" text-anchor="middle">upsampled to z14</text><path class="line" d="M504 168.5 L699 69 M504 194 L699 241" stroke-dasharray="3 3"/><rect class="apron" x="699" y="69" width="172" height="172" rx="0"/><rect class="sel" x="715" y="85" width="140" height="140" rx="0"/><path class="contour" d="M699 112 C735 96 775 150 871 124"/><path class="contour" d="M699 150 C745 128 800 196 871 166"/><path class="contour" d="M699 196 C735 180 790 226 871 206"/><text class="muted s" x="785" y="282" text-anchor="middle">z14 contour interval, dashed: fetch_margin apron</text></svg>
