<svg id="variable-depth" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" role="img" aria-label="A z14 tile the source lacks: Martin walks up past the missing z13 tile to the z12 ancestor, reads its 3 by 3 neighborhood, and upsamples the part under the z14 tile to trace it with the z14 contour interval"><title>A z14 tile the source lacks: Martin walks up past the missing z13 tile to the z12 ancestor, reads its 3 by 3 neighborhood, and upsamples the part under the z14 tile to trace it with the z14 contour interval</title><style>#variable-depth{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#variable-depth .fg{fill:var(--md-default-fg-color,#000000de)}#variable-depth .muted{fill:var(--md-default-fg-color--light,#0000008a)}#variable-depth .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#variable-depth .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#variable-depth .head{fill:var(--md-default-fg-color--light,#0000008a)}#variable-depth text{dominant-baseline:central}#variable-depth .t{font-weight:600}#variable-depth .s{font-size:11px}#variable-depth .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#variable-depth .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#variable-depth .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#variable-depth .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#variable-depth .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#variable-depth .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#variable-depth .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-o