<svg id="pp-accept" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="100%" role="img" aria-label="How the Accept header picks the served format: the source format as-is if named, else the other vector format if that conversion is enabled, else the source format for */* or no header, else 406"><title>How the Accept header picks the served format: the source format as-is if named, else the other vector format if that conversion is enabled, else the source format for */* or no header, else 406</title><style>#pp-accept{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#pp-accept .fg{fill:var(--md-default-fg-color,#000000de)}#pp-accept .muted{fill:var(--md-default-fg-color--light,#0000008a)}#pp-accept .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#pp-accept .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#pp-accept .head{fill:var(--md-default-fg-color--light,#0000008a)}#pp-accept text{dominant-baseline:central}#pp-accept .t{font-weight:600}#pp-accept .s{font-size:11px}#pp-accept .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#pp-accept .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#pp-accept .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pp-accept .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#pp-accept .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#pp-accept .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#pp-accept .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#pp-accept .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#pp-accept .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#pp-accept .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#pp-accept .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#pp-accept .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="box" x="40" y="40" width="130" height="46" rx="4"/><text class="fg t" x="105" y="63" text-anchor="middle">tile request</text><path class="arrow" d="M170 63 L218 63"/><path class="head" d="M218 63 L210.0 67.0 L210.0 59.0 Z"/><rect class="box" x="220" y="40" width="330" height="46" rx="4"/><text class="fg s t" x="385" y="55" text-anchor="middle">Accept names the source format</text><text class="muted s" x="385" y="72" text-anchor="middle">wins even at a lower q</text><path class="arrow" d="M550 63 L638 63"/><path class="head" d="M638 63 L630.0 67.0 L630.0 59.0 Z"/><text class="muted s" x="595" y="53" text-anchor="middle">yes</text><rect class="hi" x="640" y="40" width="280" height="46" rx="23"/><text class="fg" x="780" y="63" text-anchor="middle">as-is</text><path class="arrow" d="M385 86 L385 118"/><path class="head" d="M385 118 L381.0 110.0 L389.0 110.0 Z"/><text class="muted s" x="395" y="102" text-anchor="start">no</text><rect class="box" x="220" y="120" width="330" height="46" rx="4"/><text class="fg s t" x="385" y="135" text-anchor="middle">names the other vector format</text><text class="muted s" x="385" y="152" text-anchor="middle">and that conversion is not disabled</text><path class="arrow" d="M550 143 L638 143"/><path class="head" d="M638 143 L630.0 147.0 L630.0 139.0 Z"/><text class="muted s" x="595" y="133" text-anchor="middle">yes</text><rect class="hi" x="640" y="120" width="280" height="46" rx="23"/><text class="fg" x="780" y="143" text-anchor="middle">converted MVT ⇄ MLT</text><path class="arrow" d="M385 166 L385 198"/><path class="head" d="M385 198 L381.0 190.0 L389.0 190.0 Z"/><text class="muted s" x="395" y="182" text-anchor="start">no</text><rect class="box" x="220" y="200" width="330" height="46" rx="4"/><text class="fg s t" x="385" y="223" text-anchor="middle">*/* or no Accept header</text><path class="arrow" d="M550 223 L638 223"/><path class="head" d="M638 223 L630.0 227.0 L630.0 219.0 Z"/><text class="muted s" x="595" y="213" text-anchor="middle">yes</text><rect class="hi" x="640" y="200" width="280" height="46" rx="23"/><text class="fg" x="780" y="223" text-anchor="middle">as-is</text><path class="arrow" d="M385 246 L385 303 L638 303"/><path class="head" d="M638 303 L630.0 307.0 L630.0 299.0 Z"/><text class="muted s" x="395" y="262" text-anchor="start">no</text><rect class="acc" x="640" y="280" width="280" height="46" rx="23"/><text class="fg" x="780" y="303" text-anchor="middle">406 Not Acceptable</text></svg>
