<svg id="mbt-validate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" role="img" aria-label="mbtiles validate runs four checks: SQLite integrity, the schema, each tile against its stored hash, and one aggregate hash over every row in z, x, y order"><title>mbtiles validate runs four checks: SQLite integrity, the schema, each tile against its stored hash, and one aggregate hash over every row in z, x, y order</title><style>#mbt-validate{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#mbt-validate .fg{fill:var(--md-default-fg-color,#000000de)}#mbt-validate .muted{fill:var(--md-default-fg-color--light,#0000008a)}#mbt-validate .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#mbt-validate .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#mbt-validate .head{fill:var(--md-default-fg-color--light,#0000008a)}#mbt-validate text{dominant-baseline:central}#mbt-validate .t{font-weight:600}#mbt-validate .s{font-size:11px}#mbt-validate .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#mbt-validate .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#mbt-validate .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#mbt-validate .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#mbt-validate .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#mbt-validate .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#mbt-validate .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#mbt-validate .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#mbt-validate .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#mbt-validate .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#mbt-validate .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#mbt-validate .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><text class="fg t" x="40" y="18" text-anchor="start">1. integrity</text><text class="muted mono" x="40" y="36" text-anchor="start">PRAGMA integrity_check</text><text class="muted s" x="40" y="176" text-anchor="start">catches</text><text class="fg s" x="40" y="194" text-anchor="start">broken pages</text><text class="fg t" x="270" y="18" text-anchor="start">2. schema</text><text class="muted mono" x="270" y="36" text-anchor="start">tables, columns, indexes</text><text class="muted s" x="270" y="176" text-anchor="start">catches</text><text class="fg s" x="270" y="194" text-anchor="start">missing tables or columns</text><text class="fg t" x="500" y="18" text-anchor="start">3. per tile</text><text class="muted mono" x="500" y="36" text-anchor="start">tile_hash per row</text><text class="muted s" x="500" y="176" text-anchor="start">catches</text><text class="fg s" x="500" y="194" text-anchor="start">a changed tile</text><text class="fg t" x="730" y="18" text-anchor="start">4. aggregate</text><text class="muted mono" x="730" y="36" text-anchor="start">agg_tiles_hash</text><text class="muted s" x="730" y="176" text-anchor="start">catches</text><text class="fg s" x="730" y="194" text-anchor="start">missing, extra or moved tiles</text><rect class="box" x="40" y="70" width="30" height="40" rx="2"/><rect class="box" x="76" y="70" width="30" height="40" rx="2"/><rect class="box" x="112" y="70" width="30" height="40" rx="2"/><rect class="acc" x="148" y="70" width="30" height="40" rx="2"/><rect class="box" x="184" y="70" width="30" height="40" rx="2"/><path class="accline" d="M154 78 L172 102"/><path class="accline" d="M172 78 L154 102"/><text class="muted s" x="40" y="130" text-anchor="start">SQLite pages</text><rect class="box" x="270" y="60" width="86" height="70" rx="4"/><text class="fg mono" x="278" y="72" text-anchor="start">tiles</text><path class="line" d="M270 82 L356 82"/><path class="arrow" d="M278 94 L348 94"/><path class="arrow" d="M278 103 L348 103"/><path class="arrow" d="M278 112 L348 112"/><path class="arrow" d="M278 121 L348 121"/><rect class="box" x="370" y="60" width="86" height="70" rx="4"/><text class="fg mono" x="378" y="72" text-anchor="start">metadata</text><path class="line" d="M370 82 L456 82"/><path class="arrow" d="M378 94 L448 94"/><path class="arrow" d="M378 103 L448 103"/><rect class="hi" x="500" y="60" width="46" height="20" rx="10"/><text class="fg s" x="523" y="70" text-anchor="middle">tile</text><path class="arrow" d="M550 70 L574 70"/><path class="head" d="M574 70 L566.0 74.0 L566.0 66.0 Z"/><text class="fg mono" x="580" y="70" text-anchor="start">3f9c…</text><text class="fg s" x="630" y="70" text-anchor="start">matches</text><rect class="hi" x="500" y="88" width="46" height="20" rx="10"/><text class="fg s" x="523" y="98" text-anchor="middle">tile</text><path class="arrow" d="M550 98 L574 98"/><path class="head" d="M574 98 L566.0 102.0 L566.0 94.0 Z"/><text class="fg mono" x="580" y="98" text-anchor="start">81d0…</text><text class="fg s" x="630" y="98" text-anchor="start">matches</text><rect class="acc" x="500" y="116" width="46" height="20" rx="10"/><text class="fg s" x="523" y="126" text-anchor="middle">tile</text><path class="arrow" d="M550 126 L574 126"/><path class="head" d="M574 126 L566.0 130.0 L566.0 122.0 Z"/><text class="fg mono" x="580" y="126" text-anchor="start">c4e7…</text><text class="fg s t" x="630" y="126" text-anchor="start">differs</text><text class="fg mono" x="730" y="62" text-anchor="start">0 0 0</text><rect class="hi" x="780" y="54" width="34" height="16" rx="8"/><text class="fg mono" x="730" y="84" text-anchor="start">1 0 0</text><rect class="hi" x="780" y="76" width="34" height="16" rx="8"/><text class="fg mono" x="730" y="106" text-anchor="start">1 0 1</text><rect class="hi" x="780" y="98" width="34" height="16" rx="8"/><text class="fg mono" x="730" y="128" text-anchor="start">1 1 0</text><rect class="hi" x="780" y="120" width="34" height="16" rx="8"/><path class="arrow" d="M822 54 L830 54 L830 136 L822 136"/><path class="arrow" d="M830 95 L846 95"/><path class="head" d="M846 95 L838.0 99.0 L838.0 91.0 Z"/><rect class="sel" x="848" y="83" width="72" height="24" rx="12"/><text class="fg s" x="884" y="95" text-anchor="middle">one hash</text><text class="muted s" x="730" y="150" text-anchor="start">every row, in z, x, y order</text></svg>
