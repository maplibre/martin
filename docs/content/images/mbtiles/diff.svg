<svg id="mbt-diff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" role="img" aria-label="mbtiles diff compares file1 and file2 into a diff holding changed, added and deleted tiles plus both aggregate hashes; apply-patch turns file1 and the diff into a copy of file2"><title>mbtiles diff compares file1 and file2 into a diff holding changed, added and deleted tiles plus both aggregate hashes; apply-patch turns file1 and the diff into a copy of file2</title><style>#mbt-diff{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#mbt-diff .fg{fill:var(--md-default-fg-color,#000000de)}#mbt-diff .muted{fill:var(--md-default-fg-color--light,#0000008a)}#mbt-diff .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#mbt-diff .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#mbt-diff .head{fill:var(--md-default-fg-color--light,#0000008a)}#mbt-diff text{dominant-baseline:central}#mbt-diff .t{font-weight:600}#mbt-diff .s{font-size:11px}#mbt-diff .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#mbt-diff .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#mbt-diff .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#mbt-diff .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#mbt-diff .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#mbt-diff .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#mbt-diff .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#mbt-diff .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#mbt-diff .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#mbt-diff .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#mbt-diff .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><rect class="box" x="40" y="40" width="170" height="86" rx="4"/><text class="fg t mono" x="50" y="56" text-anchor="start">file1.mbtiles</text><rect class="hi" x="51" y="74" width="34" height="20" rx="10"/><text class="fg s" x="68" y="84" text-anchor="middle">a</text><rect class="hi" x="93" y="74" width="34" height="20" rx="10"/><text class="fg s" x="110" y="84" text-anchor="middle">b</text><rect class="hi" x="135" y="74" width="34" height="20" rx="10"/><text class="fg s" x="152" y="84" text-anchor="middle">c</text><text class="muted mono" x="50" y="112" text-anchor="start">agg_tiles_hash = H1</text><rect class="box" x="40" y="160" width="170" height="86" rx="4"/><text class="fg t mono" x="50" y="176" text-anchor="start">file2.mbtiles</text><rect class="hi" x="51" y="194" width="34" height="20" rx="10"/><text class="fg s" x="68" y="204" text-anchor="middle">a</text><rect class="acc" x="93" y="194" width="34" height="20" rx="10"/><text class="fg s" x="110" y="204" text-anchor="middle">b′</text><rect class="acc" x="135" y="194" width="34" height="20" rx="10"/><text class="fg s" x="152" y="204" text-anchor="middle">d</text><text class="muted mono" x="50" y="232" text-anchor="start">agg_tiles_hash = H2</text><path class="arrow" d="M210 83 L232 83 L232 143 L254 143"/><path class="head" d="M254 143 L246.0 147.0 L246.0 139.0 Z"/><path class="arrow" d="M210 203 L232 203 L232 143 L254 143"/><path class="head" d="M254 143 L246.0 147.0 L246.0 139.0 Z"/><rect class="hi" x="256" y="128" width="104" height="30" rx="15"/><text class="fg mono" x="308" y="143" text-anchor="middle">mbtiles diff</text><path class="arrow" d="M360 143 L386 143"/><path class="head" d="M386 143 L378.0 147.0 L378.0 139.0 Z"/><rect class="box" x="388" y="64" width="220" height="160" rx="4"/><text class="fg t mono" x="398" y="80" text-anchor="start">diff.mbtiles</text><rect class="acc" x="399" y="96" width="34" height="20" rx="10"/><text class="fg s" x="416" y="106" text-anchor="middle">b′</text><text class="muted s" x="442" y="106" text-anchor="start">changed</text><rect class="ghost" x="399" y="122" width="34" height="20" rx="10"/><text class="fg s" x="416" y="132" text-anchor="middle">c</text><text class="muted s" x="442" y="132" text-anchor="start">deleted (NULL)</text><rect class="acc" x="399" y="148" width="34" height="20" rx="10"/><text class="fg s" x="416" y="158" text-anchor="middle">d</text><text class="muted s" x="442" y="158" text-anchor="start">added</text><path class="line" d="M388 176 L608 176"/><text class="muted mono" x="398" y="192" text-anchor="start">…before_apply = H1</text><text class="muted mono" x="398" y="210" text-anchor="start">…after_apply = H2</text><path class="arrow" d="M608 143 L640 143"/><path class="head" d="M640 143 L632.0 147.0 L632.0 139.0 Z"/><path class="arrow" d="M125 40 L125 22 L697 22 L697 126" stroke-dasharray="4 3"/><path class="head" d="M697 126 L693.0 118.0 L701.0 118.0 Z"/><text class="muted s" x="411" y="12" text-anchor="middle">file1.mbtiles</text><rect class="hi" x="642" y="128" width="110" height="30" rx="15"/><text class="fg mono" x="697" y="143" text-anchor="middle">apply-patch</text><text class="muted s" x="697" y="176" text-anchor="middle">requires file1 = H1</text><path class="arrow" d="M752 143 L776 143"/><path class="head" d="M776 143 L768.0 147.0 L768.0 139.0 Z"/><rect class="box" x="778" y="100" width="150" height="86" rx="4"/><text class="fg t mono" x="788" y="116" text-anchor="start">file2a.mbtiles</text><rect class="hi" x="789" y="134" width="34" height="20" rx="10"/><text class="fg s" x="806" y="144" text-anchor="middle">a</text><rect class="acc" x="831" y="134" width="34" height="20" rx="10"/><text class="fg s" x="848" y="144" text-anchor="middle">b′</text><rect class="acc" x="873" y="134" width="34" height="20" rx="10"/><text class="fg s" x="890" y="144" text-anchor="middle">d</text><text class="muted mono" x="788" y="172" text-anchor="start">agg_tiles_hash = H2</text><text class="muted s" x="853" y="206" text-anchor="middle">= file2</text></svg>
