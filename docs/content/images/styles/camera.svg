<svg id="static-camera" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 222" width="100%" role="img" aria-label="The four static image camera forms: center and zoom north up, a bearing clockwise from north, a pitch tilting away from straight down, and a bounding box that is fully visible with extra map on the shorter side"><title>The four static image camera forms: center and zoom north up, a bearing clockwise from north, a pitch tilting away from straight down, and a bounding box that is fully visible with extra map on the shorter side</title><style>#static-camera{font-family:var(--md-text-font-family,system-ui),system-ui,sans-serif;font-size:13px}#static-camera .fg{fill:var(--md-default-fg-color,#000000de)}#static-camera .muted{fill:var(--md-default-fg-color--light,#0000008a)}#static-camera .line{stroke:var(--md-default-fg-color--lighter,#00000052);fill:none}#static-camera .arrow{stroke:var(--md-default-fg-color--light,#0000008a);fill:none;stroke-width:1.5}#static-camera .head{fill:var(--md-default-fg-color--light,#0000008a)}#static-camera text{dominant-baseline:central}#static-camera .t{font-weight:600}#static-camera .s{font-size:11px}#static-camera .mono{font-family:var(--md-code-font-family,ui-monospace),ui-monospace,monospace;font-size:11px}#static-camera .box{fill:var(--md-code-bg-color,#f5f5f5);stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5}#static-camera .hi{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.1;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#static-camera .sel{fill:var(--md-primary-fg-color,#673ab7);fill-opacity:.3;stroke:var(--md-primary-fg-color,#673ab7);stroke-width:1.5}#static-camera .acc{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5}#static-camera .ghost{fill:none;stroke:var(--md-default-fg-color--lighter,#00000052);stroke-width:1.5;stroke-dasharray:4 3}#static-camera .apron{fill:var(--md-accent-fg-color,#7c4dff);fill-opacity:.12;stroke:var(--md-accent-fg-color,#7c4dff);stroke-width:1.5;stroke-dasharray:5 3}#static-camera .frame{fill:none;stroke:var(--md-default-fg-color--light,#0000008a);stroke-width:1.5}#static-camera .accline{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:2}#static-camera .accdot{fill:var(--md-accent-fg-color,#7c4dff)}#static-camera .accarrow{stroke:var(--md-accent-fg-color,#7c4dff);fill:none;stroke-width:1.5}#static-camera .acchead{fill:var(--md-accent-fg-color,#7c4dff)}</style><clipPath id="cam-clip-0"><rect x="30" y="40" width="180" height="130"/></clipPath><g clip-path="url(#cam-clip-0)"><g><path class="line" d="M-80 -51 L320 -51"/><path class="line" d="M-36 -95 L-36 305"/><path class="line" d="M-80 -25 L320 -25"/><path class="line" d="M-10 -95 L-10 305"/><path class="line" d="M-80 1 L320 1"/><path class="line" d="M16 -95 L16 305"/><path class="line" d="M-80 27 L320 27"/><path class="line" d="M42 -95 L42 305"/><path class="line" d="M-80 53 L320 53"/><path class="line" d="M68 -95 L68 305"/><path class="line" d="M-80 79 L320 79"/><path class="line" d="M94 -95 L94 305"/><path class="line" d="M-80 105 L320 105"/><path class="line" d="M120 -95 L120 305"/><path class="line" d="M-80 131 L320 131"/><path class="line" d="M146 -95 L146 305"/><path class="line" d="M-80 157 L320 157"/><path class="line" d="M172 -95 L172 305"/><path class="line" d="M-80 183 L320 183"/><path class="line" d="M198 -95 L198 305"/><path class="line" d="M-80 209 L320 209"/><path class="line" d="M224 -95 L224 305"/><path class="line" d="M-80 235 L320 235"/><path class="line" d="M250 -95 L250 305"/><path class="line" d="M-80 261 L320 261"/><path class="line" d="M276 -95 L276 305"/><rect class="hi" x="134" y="65" width="40" height="26" rx="2"/><rect class="hi" x="54" y="115" width="30" height="40" rx="2"/><path class="accline" d="M30 75 L100 95 L150 135 L210 145"/></g></g><rect class="frame" x="30" y="40" width="180" height="130" rx="0"/><path class="arrow" d="M113 105 L127 105"/><path c