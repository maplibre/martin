# https://nexte.st/docs/configuration/

[profile.default]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "120s" }

[test-groups]
# auto-discovers a whole database, which builds a pool of DEFAULT_POOL_SIZE (20) connections.
# the postgis images defaults to 100 connections
postgres = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(/^pg_/)'
test-group = 'postgres'

# the quick bounds give up after DEFAULT_BOUNDS_TIMEOUT (5s), which other tests sharing the cpus can push them past
[[profile.default.overrides]]
filter = 'test(/duckdb::resolver::bounds::tests::/)'
threads-required = 'num-test-threads'
