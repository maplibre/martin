# DuckDB GeoParquet E2E config (requires `unstable-duckdb`).
# Valid polygon source plus a deliberately invalid sibling so `on_invalid: warn`
# keeps the good source public while logging the bad one.
on_invalid: warn
duckdb:
  sources:
    - geoparquet: tests/fixtures/duckdb/geoparquet_polygons.parquet
      layer_id: polygons
      geometry_column: geom
      srid: 4326
      minzoom: 0
      maxzoom: 14
    - geoparquet: tests/fixtures/duckdb/geoparquet_polygons.parquet
      layer_id: polygons_bad
      geometry_column: nonexistent
      srid: 4326
