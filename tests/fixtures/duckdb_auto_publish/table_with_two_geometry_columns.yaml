config:
  database: fixture.duckdb
  auto_publish:
    tables:
      source_id_format: "{table}.{column}"
catalog:
  columns:
    - { schema: main, table: parcels, column: id, data_type: INTEGER }
    - { schema: main, table: parcels, column: outline, data_type: GEOMETRY }
    - { schema: main, table: parcels, column: centroid, data_type: GEOMETRY }
