on_invalid: warn
listen_addresses: localhost:3111
duckdb:
  sources:
  - geoparquet: tests/fixtures/duckdb/geoparquet_polygons.parquet
    layer_id: polygons
    geometry_column: geom
    srid: 4326
    minzoom: 0
    maxzoom: 14
    pool_size: 4
    auto_bounds: quick
  - geoparquet: tests/fixtures/duckdb/geoparquet_polygons.parquet
    layer_id: polygons_bad
    geometry_column: nonexistent
    srid: 4326
    pool_size: 4
    auto_bounds: quick
