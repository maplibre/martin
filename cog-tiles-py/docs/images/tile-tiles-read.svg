<svg class="d" viewBox="0 0 904 300" role="img" aria-label="cog.tile returns one internal tile from one range read, or None if there is no data there. cog.tiles yields every encoded tile with data in bbox as (z, x, y, data), in arrival order. cog.read stitches the decoded tiles bbox touches into one raster of whole pixels; pixels without data are 0" xmlns="http://www.w3.org/2000/svg">
<title>cog.tile returns one internal tile from one range read, or None if there is no data there. cog.tiles yields every encoded tile with data in bbox as (z, x, y, data), in arrival order. cog.read stitches the decoded tiles bbox touches into one raster of whole pixels; pixels without data are 0</title>
<style>.d{--fg:var(--md-default-fg-color,#6e7781);--light:var(--md-default-fg-color--light,#848d97);
--lighter:var(--md-default-fg-color--lighter,#848d9799);--f0:#3f7ad6;--f1:#e07a2e;
font-family:var(--md-code-font-family,ui-monospace,monospace);font-size:13px}
.d text{fill:var(--fg);dominant-baseline:central}
.d .muted{fill:var(--light)}.d .small{font-size:11px}.d .mid{text-anchor:middle}
.d .tile{fill:none;stroke:var(--light);stroke-width:1}
.d .nodata{fill:url(#hatch);stroke:var(--light);stroke-width:1}
.d .hatch{stroke:var(--lighter);stroke-width:1.5}
.d .picked{fill:var(--f1);fill-opacity:.2;stroke:var(--f1);stroke-width:1.5}
.d .decoded{fill:var(--f0);fill-opacity:.1;stroke:var(--f0);stroke-width:1}
.d .raster{fill:var(--f0);fill-opacity:.3;stroke:var(--f0);stroke-width:1.5}
.d .bbox{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 4}</style>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="8"/></pattern>
