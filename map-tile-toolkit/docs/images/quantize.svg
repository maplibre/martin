<svg class="d" viewBox="0 0 904 270" role="img" aria-label="Rounding each vertex on its own can make two edges of a valid polygon cross. Quantizer::polygon keeps rounded rings that stay valid and otherwise snap-rounds: two tip vertices merge into one, a hole rounded onto the exterior becomes a notch. Quantizer::make_valid also takes an invalid polygon: a self-crossing exterior keeps both lobes, split at an added vertex where its edges cross" xmlns="http://www.w3.org/2000/svg">
<title>Rounding each vertex on its own can make two edges of a valid polygon cross. Quantizer::polygon keeps rounded rings that stay valid and otherwise snap-rounds: two tip vertices merge into one, a hole rounded onto the exterior becomes a notch. Quantizer::make_valid also takes an invalid polygon: a self-crossing exterior keeps both lobes, split at an added vertex where its edges cross</title>
<style>.d{--fg:var(--md-default-fg-color,#6e7781);--light:var(--md-default-fg-color--light,#848d97);
