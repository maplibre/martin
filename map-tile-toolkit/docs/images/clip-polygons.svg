<svg class="d" viewBox="0 0 878.8 458.8" role="img" aria-label="Polygon clipping keeps every vertex with an edge touching the tile's box and closes each ring past the box: a dropped excursion becomes synthetic corners one unit outside the box, or a straight chord, unless keeping its vertices is shorter; a covered tile gets the four corners, a tile inside a hole gets nothing. A hole crossing the tile keeps its own outside vertices, so where the exterior's far part was dropped, the hole can reach past the exterior: the piece is valid only inside the tile" xmlns="http://www.w3.org/2000/svg">
<title>Polygon clipping keeps every vertex with an edge touching the tile's box and closes each ring past the box: a dropped excursion becomes synthetic corners one unit outside the box, or a straight chord, unless keeping its vertices is shorter; a covered tile gets the four corners, a tile inside a hole gets nothing. A hole crossing the tile keeps its own outside vertices, so where the exterior's far part was dropped, the hole can reach past the exterior: the piece is valid only inside the tile</title>
<style>.d{--fg:var(--md-default-fg-color,#6e7781);--light:var(--md-default-fg-color--light,#848d97);
--lighter:var(--md-default-fg-color--lighter,#848d9799);--f0:#3f7ad6;--f1:#e07a2e;
font-family:var(--md-code-font-family,ui-monospace,monospace);font-size:13px}
.d text{fill:var(--fg);dominant-baseline:central}
.d .muted{fill:var(--light)}.d .small{font-size:11px}.d .bold{font-weight:700}.d .mid{text-anchor:middle}
.d .tile{fill:none;stroke:var(--light);stroke-width:1}
.d .buf{fill:none;stroke:var(--light);stroke-dasharray:3 3}
.d .input{fill:none;stroke:var(--lighter);stroke-width:1.5;stroke-linejoin:round}
.d .line{fill:none;stroke:var(--f1);stroke-width:2;stroke-linejoin:round}
.d .f1{fill:var(--f1);fill-opacity:.2;stroke:var(--f1);stroke-width:1.5;stroke-linejoin:round}
.d .synth{fill:none;stroke:var(--f0);stroke-width:1.5;stroke-dasharray:4 2}
.d .kept{fill:var(--f1)}
.d .dropped{fill:none;stroke:var(--light);stroke-width:1.25}
.d .corner{fill:var(--f0)}
.d .t0{fill:var(--f0)}.d .t1{fill:var(--f1)}</style>
