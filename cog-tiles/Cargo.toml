[package]
name = "cog-tiles"
version = "0.3.0"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>", "MapLibre contributors"]
description = "Read web map tiles from Cloud Optimized GeoTIFFs (COG) in local files or object stores, fetching only the bytes each tile needs"
keywords = ["cog", "geotiff", "tiles", "webmercator", "gis"]
categories = ["science::geo", "encoding", "asynchronous"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
features = ["__all"]

[features]
default = ["fs", "png"]
# Read COGs from local files.
fs = ["tokio/rt", "tokio/fs"]
# Re-encode tiles that cannot be passed through as-is (e.g. deflate or LZW RGB) as PNG.
png = ["dep:png"]
# Read COGs from any `object_store` backend (S3, GCS, Azure, HTTP, memory, ...).
object-store = ["dep:object_store"]
# Decode WebP tiles to pixels, and encode tiles as WebP (links libwebp).
webp = ["png", "async-tiff/webp", "dep:webp"]
# Encode tiles as JPEG.
jpeg = ["png", "dep:image"]
# Read mosaics of many COGs, each named after the tile it covers (e.g. `{quadkey}.tif`),
# or found per tile by an index and reprojected from UTM.
mosaic = ["fs", "png", "object-store", "dep:tracing"]
# Find a mosaic's files for each tile by searching a STAC API.
stac = ["mosaic", "dep:reqwest", "dep:serde", "dep:serde_json"]
# Find a mosaic's files for each tile in a `gdaltindex` tile index (a GeoPackage).
tile-index = ["mosaic", "dep:geo-index", "dep:sqlx", "dep:url"]

#### These features are for the internal usage only
# This is a list of features we use in docs.rs, CI and other places where we want everything.
__all = ["fs", "png", "object-store", "mosaic", "stac", "tile-index", "webp", "jpeg"]

[dependencies]
async-tiff.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
geo-index = { workspace = true, optional = true }
image = { workspace = true, optional = true }
moka = { workspace = true, features = ["future"] }
object_store = { workspace = true, optional = true }
png = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
webp = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
insta.workspace = true
jpeg-decoder.workspace = true
object_store.workspace = true
png.workspace = true
rstest.workspace = true
tempfile.workspace = true
tiff.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
