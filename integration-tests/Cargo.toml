[package]
name = "martin-integration-tests"
version = "0.0.0"
description = "End-to-end tests that run the martin binary as a subprocess and assert on its HTTP responses and logs"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Run the DuckDB/GeoParquet tests. The martin binary they drive must be built with `unstable-duckdb`.
duckdb = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
brotli.workspace = true
flate2.workspace = true
mlt-core.workspace = true
regex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
approx.workspace = true
insta = { workspace = true, features = ["filters", "json"] }
pbf_font_tools.workspace = true
png.workspace = true
rstest.workspace = true

[lints]
workspace = true
