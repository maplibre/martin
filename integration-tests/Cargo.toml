[package]
name = "martin-integration-tests"
version = "0.0.0"
description = "End-to-end tests that run the martin and mbtiles binaries as subprocesses and assert on their output"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-duckdb = []
test-pg = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
brotli.workspace = true
flate2.workspace = true
mlt-core.workspace = true
regex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }
wiremock.workspace = true

[dev-dependencies]
approx.workspace = true
flate2.workspace = true
insta = { workspace = true, features = ["filters", "json"] }
mlt-core.workspace = true
pbf_font_tools.workspace = true
png.workspace = true
rstest.workspace = true

[lints]
workspace = true
