# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================

[project]
docs_dir = "docs/content"
site_dir = "target/book"
site_name = "Martin Tile Server Documentation"
site_description = "Martin is a fast tile server that serves vector and raster tiles from PostGIS, PMTiles, MBTiles, COG, GeoJSON and DuckDB, along with sprites, fonts and styles."
repo_url = "https://github.com/maplibre/martin"
edit_uri = "edit/main/docs/content"
site_url = "https://maplibre.org/martin/"
site_author = "Maplibre Contributors"
copyright = "Copyright &copy; 2026 MapLibre Contributors"

